<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img">
<title>Eksportverdien følger prisene, ikke mengden</title>
<desc>Pris- og volumindeks for vareeksporten 2015–2025, 2000 = 100. I 2022 steg prisene 81,8 prosent og volumet 0,2 prosent.</desc>
<rect x="0" y="0" width="1200" height="330" fill="#ffffff"/>
<text x="40" y="46" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#5e787a" text-anchor="start">UTENRIKSHANDEL MED VARER · 2022</text>
<text x="40" y="122" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="66" font-weight="700" fill="#274246" text-anchor="start">+82 %</text>
<text x="40" y="164" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="21" font-weight="700" fill="#274246" text-anchor="start">Eksportprisene steg 82 prosent i 2022.</text>
<text x="40" y="191" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="21" font-weight="700" fill="#274246" text-anchor="start">Mengden sto nesten stille.</text>
<text x="40" y="225" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="400" fill="#5e787a" text-anchor="start">Volumet økte 0,2 prosent. Eksportverdien gikk fra 1 493 til</text>
<text x="40" y="246" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="400" fill="#5e787a" text-anchor="start">2 663 mrd. kr.</text>
<text x="40" y="267" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="400" fill="#5e787a" text-anchor="start">Mest av økningen kom fra høyere gasspriser.</text>
<text x="640" y="48" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#5e787a" text-anchor="start">indeks, 2000 = 100</text>
