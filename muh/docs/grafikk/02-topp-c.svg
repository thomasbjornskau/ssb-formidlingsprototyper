<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img">
<title>Overskudd med olje og gass, underskudd for fastlandet</title>
<desc>Handelsbalansen og fastlandsbalansen 2015–2025. I 2025 var handelsbalansen 660,9 mrd. kr og fastlandsbalansen minus 347,7 mrd. kr.</desc>
<rect x="0" y="0" width="1200" height="330" fill="#ffffff"/>
<text x="40" y="46" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#5e787a" text-anchor="start">UTENRIKSHANDEL MED VARER · 2025</text>
<text x="40" y="122" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="66" font-weight="700" fill="#274246" text-anchor="start">−350 mrd. kr</text>
<text x="40" y="164" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="21" font-weight="700" fill="#274246" text-anchor="start">Fastlands-Norge kjøpte varer for om lag</text>
<text x="40" y="191" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="21" font-weight="700" fill="#274246" text-anchor="start">350 mrd. kr mer enn det solgte i 2025.</text>
<text x="40" y="225" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="400" fill="#5e787a" text-anchor="start">Med olje og gass ble det likevel et overskudd på 661 mrd. kr.</text>
<text x="40" y="246" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="400" fill="#5e787a" text-anchor="start">Fastlandsbalansen har vært negativ alle år 2015–2025.</text>
