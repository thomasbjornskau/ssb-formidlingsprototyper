<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img"><title>Bidrag til prisveksten fra hver gruppe, september 2026</title><text x="0.0" y="30.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#5e787a" text-anchor="start">KONSUMPRISINDEKSEN · SEPTEMBER 2026</text><text x="0.0" y="84.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="44" font-weight="700" fill="#274246" text-anchor="start">3,4 prosent</text><text x="0.0" y="124.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" fill="#274246" text-anchor="start">Bolig og strøm står for om lag en tredel av prisveksten</text><text x="0.0" y="166.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#5e787a" text-anchor="start">Bidrag til tolvmånedersveksten, prosentpoeng.</text><text x="0.0" y="187.8" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#5e787a" text-anchor="start">Grovt anslag (vekt × endring) som summerer til 3,5, ikke 3,4.</text><text x="0.0" y="209.5" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#5e787a" text-anchor="start">Beregnes med SSBs metode i steg 3.</text><text x="560.0" y="246.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#5e787a" text-anchor="start">Bidrag i prosentpoeng</text><rect x="560.0" y="120.0" width="192.0" height="46.0" rx="0" fill="#00824d" stroke="none" stroke-width="1.5"/><text x="568.0" y="149.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#fff" text-anchor="start">1,1</text><text x="564.0" y="186.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#274246" text-anchor="start">Bolig og strøm</text><rect x="754.0" y="120.0" width="115.6" height="46.0" rx="0" fill="#c3cdcf" stroke="none" stroke-width="1.5"/><text x="762.0" y="149.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#274246" text-anchor="start">0,7</text><text x="758.0" y="186.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#274246" text-anchor="start">Transport</text><rect x="871.6" y="120.0" width="61.2" height="46.0" rx="0" fill="#c3cdcf" stroke="none" stroke-width="1.5"/><text x="879.6" y="149.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#274246" text-anchor="start">0,4</text><line x1="903.2" y1="116.0" x2="903.2" y2="104.0" stroke="#274246" stroke-width="1"/><text x="903.2" y="98.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#274246" text-anchor="middle">Restaurant og overnatting</text><rect x="934.9" y="120.0" width="243.1" height="46.0" rx="0" fill="#c3cdcf" stroke="none" stroke-width="1.5"/><text x="942.9" y="149.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#274246" text-anchor="start">1,4</text><text x="938.9" y="186.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#274246" text-anchor="start">10 andre grupper</text></svg>