<text x="962" y="237" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" fill="#274246">Innvandrere</text>
<text x="940" y="280" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="13" fill="#5e787a">Tall i parentes: antall</text>
<text x="940" y="299" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="13" fill="#5e787a">utenfor. Gruppene</text>
<text x="940" y="318" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="13" fill="#5e787a">uoppgitt/ingen utdanning er</text>
<text x="940" y="337" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="13" fill="#5e787a">små.</text>
<text x="940" y="376" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="13" fill="#5e787a">Forslag til seksjon. Kan</text>
<text x="940" y="395" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="13" fill="#5e787a">styres av gruppevelgeren</text>
<text x="940" y="414" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="13" fill="#5e787a">(alder, kjønn).</text>
<text x="40" y="540" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="13" fill="#5e787a">Kilde: SSB, tabell 12424. Sist oppdatert: 04.09.2026. Tallene for 2025 er foreløpige.</text>
