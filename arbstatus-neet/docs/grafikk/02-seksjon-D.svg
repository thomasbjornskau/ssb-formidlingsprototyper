<text x="40" y="46" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#5e787a">Unge utenfor · 25–29 år · 2025</text>
<text x="40" y="86" font-family="Roboto Condensed, Arial Narrow, Arial, sans-serif" font-size="24" font-weight="bold" fill="#274246">Blant unge med bare grunnskole er mange utenfor – og de fleste av dem er på AAP eller uføretrygd</text>
<text x="40" y="114" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" fill="#5e787a">Hver sirkel er en gruppe. Arealet viser hvor mange som er utenfor.</text>
