<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330">
<title>Toppgrafikk B: tyngre enn før</title>
<rect x="0" y="0" width="1200" height="330" fill="#ffffff"/>
<text x="40" y="46" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#5e787a">Unge utenfor · 15–29 år · 2008–2025</text>
<text x="40" y="122" font-family="Roboto Condensed, Arial Narrow, Arial, sans-serif" font-size="54" font-weight="bold" fill="#274246">Dobbelt så mange</text>
<text x="40" y="164" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="21" font-weight="600" fill="#274246">unge utenfor er på AAP eller uføretrygd</text>
<text x="40" y="192" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="21" font-weight="600" fill="#274246">som i 2008.</text>
<text x="40" y="228" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" fill="#5e787a">Andelen unge utenfor er omtrent den samme (9,3 prosent i 2008,</text>
<text x="40" y="249" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" fill="#5e787a">10,1 i 2025). Men gruppen på AAP eller uføretrygd har økt fra</text>
<text x="40" y="270" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" fill="#5e787a">12 462 til 27 621.</text>
<text x="40" y="314" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="13" fill="#5e787a">Kilde: SSB, tabell 12424. Sist oppdatert: 04.09.2026. Tallene for 2025 er foreløpige.</text>
<text x="640" y="46" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="13" fill="#5e787a">antall personer</text>
