<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330"><title>Toppgrafikk C: hva driver veksten</title><rect width="1200" height="330" fill="#ffffff"/><text x="40.0" y="42.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#5e787a" text-anchor="start" style="font-variant-numeric:tabular-nums">PASIENTER I SPESIALISTHELSETJENESTEN · SOMATIKK 2015–2025</text><text x="40.0" y="112.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="60" font-weight="700" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">+379 000</text><text x="40.0" y="150.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">flere pasienter fra 2015 til 2025. Halvparten fordi</text><text x="40.0" y="176.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">vi er flere innbyggere.</text><text x="40.0" y="212.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#5e787a" text-anchor="start" style="font-variant-numeric:tabular-nums">En femdel fordi befolkningen er eldre. Resten fordi alle</text><text x="40.0" y="233.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#5e787a" text-anchor="start" style="font-variant-numeric:tabular-nums">aldersgrupper bruker mer: blant 80–89-åringene fra 814 til 881</text><text x="40.0" y="254.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#5e787a" text-anchor="start" style="font-variant-numeric:tabular-nums">per 1 000.</text><text x="40.0" y="279.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#5e787a" text-anchor="start" style="font-variant-numeric:tabular-nums">Egen beregning med SSBs folketall. Ikke publisert av SSB.</text><text x="40.0" y="312.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#5e787a" text-anchor="start" style="font-variant-numeric:tabular-nums">Kilde: SSB, tabell 14824 og 07459. Egen beregning. Sist oppdatert: 22.06.2026.</text><text x="820.0" y="58.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#5e787a" text-anchor="start" style="font-variant-numeric:tabular-nums">økning i antall pasienter, 2015–2025</text><line x1="820.0" y1="66.0" x2="820.0" y2="162.0" stroke="#d9dfe0" stroke-width="1"/><text x="820.0" y="176.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#5e787a" text-anchor="middle" style="font-variant-numeric:tabular-nums">0</text><line x1="915.0" y1="66.0" x2="915.0" y2="162.0" stroke="#d9dfe0" stroke-width="1"/><text x="915.0" y="176.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#5e787a" text-anchor="middle" style="font-variant-numeric:tabular-nums">100 000</text><line x1="1010.0" y1="66.0" x2="1010.0" y2="162.0" stroke="#d9dfe0" stroke-width="1"/><text x="1010.0" y="176.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#5e787a" text-anchor="middle" style="font-variant-numeric:tabular-nums">200 000</text><rect x="820.0" y="70.0" width="180.1" height="22.0" fill="#00824d" stroke="none" stroke-width="1"/><text x="812.0" y="86.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#274246" text-anchor="end" style="font-variant-numeric:tabular-nums">Flere innbyggere</text><text x="1006.1" y="86.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">+190 000 (50 prosent)</text><rect x="820.0" y="103.0" width="66.9" height="22.0" fill="#00824d" stroke="none" stroke-width="1"/><text x="812.0" y="119.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#274246" text-anchor="end" style="font-variant-numeric:tabular-nums">Eldre befolkning</text><text x="892.9" y="119.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">+70 000 (19 prosent)</text><rect x="820.0" y="136.0" width="113.5" height="22.0" fill="#00824d" stroke="none" stroke-width="1"/><text x="812.0" y="152.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#274246" text-anchor="end" style="font-variant-numeric:tabular-nums">Mer bruk per person</text><text x="939.5" y="152.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">+119 000 (31 prosent)</text><line x1="820.0" y1="66.0" x2="820.0" y2="162.0" stroke="#a9b5b7" stroke-width="1.2"/><text x="690.0" y="208.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#5e787a" text-anchor="start" style="font-variant-numeric:tabular-nums">pasienter per 1 000 innbyggere</text><text x="772.0" y="228.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#5e787a" text-anchor="middle" style="font-variant-numeric:tabular-nums">0–17</text><text x="772.0" y="246.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#274246" text-anchor="middle" style="font-variant-numeric:tabular-nums">342</text><text x="772.0" y="264.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#274246" text-anchor="middle" style="font-variant-numeric:tabular-nums">367</text><text x="836.0" y="228.0" font-family="Open Sans, Segoe UI, Arial, sans