<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330"><title>Toppgrafikk B: største diagnosegruppe</title><rect width="1200" height="330" fill="#ffffff"/><text x="40.0" y="42.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#5e787a" text-anchor="start" style="font-variant-numeric:tabular-nums">PASIENTER I SPESIALISTHELSETJENESTEN · SOMATIKK 2025</text><text x="40.0" y="112.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="60" font-weight="700" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">793 000</text><text x="40.0" y="150.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">pasienter var til kontroll, oppfølging eller annen</text><text x="40.0" y="176.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">kontakt (Z-kapitlet). Det er den største</text><text x="40.0" y="202.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">diagnosegruppen.</text><text x="40.0" y="238.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#5e787a" text-anchor="start" style="font-variant-numeric:tabular-nums">Samme person kan stå i flere kapitler. Kapitlene summerer til</text><text x="40.0" y="259.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#5e787a" text-anchor="start" style="font-variant-numeric:tabular-nums">5,2 millioner, nesten dobbelt så mange som pasientene.</text><text x="40.0" y="312.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#5e787a" text-anchor="start" style="font-variant-numeric:tabular-nums">Kilde: SSB, tabell 14824. Sist oppdatert: 22.06.2026.</text><text x="870.0" y="54.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#5e787a" text-anchor="start" style="font-variant-numeric:tabular-nums">pasienter, tusen</text><line x1="870.0" y1="62.0" x2="870.0" y2="277.0" stroke="#d9dfe0" stroke-width="1"/><text x="870.0" y="291.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#5e787a" text-anchor="middle" style="font-variant-numeric:tabular-nums">0</text><line x1="925.0" y1="62.0" x2="925.0" y2="277.0" stroke="#d9dfe0" stroke-width="1"/><text x="925.0" y="291.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#5e787a" text-anchor="middle" style="font-variant-numeric:tabular-nums">200</text><line x1="980.0" y1="62.0" x2="980.0" y2="277.0" stroke="#d9dfe0" stroke-width="1"/><text x="980.0" y="291.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#5e787a" text-anchor="middle" style="font-variant-numeric:tabular-nums">400</text><line x1="1035.0" y1="62.0" x2="1035.0" y2="277.0" stroke="#d9dfe0" stroke-width="1"/><text x="1035.0" y="291.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#5e787a" text-anchor="middle" style="font-variant-numeric:tabular-nums">600</text><line x1="1090.0" y1="62.0" x2="1090.0" y2="277.0" stroke="#d9dfe0" stroke-width="1"/><text x="1090.0" y="291.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#5e787a" text-anchor="middle" style="font-variant-numeric:tabular-nums">800</text><rect x="870.0" y="66.0" width="218.1" height="18.0" fill="#00824d" stroke="none" stroke-width="1"/><text x="862.0" y="80.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#274246" text-anchor="end" style="font-variant-numeric:tabular-nums">Kontroller, oppfølging og annen kontakt (Z)</text><text x="1094.1" y="80.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">793</text><rect x="870.0" y="93.0" width="122.7" height="18.0" fill="#b9c5c6" stroke="none" stroke-width="1"/><text x="862.0" y="107.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#274246" text-anchor="end" style="font-variant-numeric:tabular-nums">Symptomer og funn (R)</text><text x="998.7" y="107.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">446</text><rect x="870.0" y="120.0" width="113.6" height="18.0" fill="#b9c5c6" stroke="none" stroke-width="1"/><text x="862.0" y="134.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#274246" text-anchor="end" style="font-variant-numeric:tabular-nums">Øyet (H)</text><text x="989.6" y="134.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">413</text><rect x="870.0" y="147.0" width="113.2" height="18.0" fill="#b9c5c6" stroke="none" stroke-width="1"/><text x="862.0" y="161.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#274246" text-anchor="end" style="font-variant-numeric:tabular-nums">Muskel og skjelett (M)</text><text x="989.2" y="161.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">412</text><rect x="870.0" y="174.0" width="100.0" height="18.0" fill="#b9c5c6" stroke="none" stroke-width="1"/><text x="862.0" y="188.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#274246" text-anchor="end" style="font-variant-numeric:tabular-nums">Skader og forgiftninger (S)</text><text x="976.0" y="188.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">364</text><rect x="870.0" y="201.0" width="94.2" height="18.0" fill="#b9c5c6" stroke="none" stroke-width="1"/><text x="862.0" y="215.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#274246" text-anchor="end" style="font-variant-numeric:tabular-nums">Urin- og kjønnsorganer (N)</text><text x="970.2" y="215.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">343</text><rect x="870.0" y="228.0" width="78.8" height="18.0" fill="#b9c5c6" stroke="none" stroke-width="1"/><text x="862.0" y="242.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#274246" text-anchor="end" style="font-variant-numeric:tabular-nums">Svulster (C)</text><text x="954.8" y="242.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">286</text><rect x="870.0" y="255.0" width="78.7" height="18.0" fill="#b9c5c6" stroke="none" stroke-width="1"/><text x="862.0" y="269.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#274246" text-anchor="end" style="font-variant-numeric:tabular-nums">Fordøyelse (K)</text><text x="954.7" y="269.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">286</text><line x1="870.0" y1="62.0" x2="870.0" y2="277.0" stroke="#a9b5b7" stroke-width="1.2"/><text x="862.0" y="309.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#5e787a" text-anchor="end" style="font-variant-numeric:tabular-nums">De åtte største av 20 kapitler</text></svg>