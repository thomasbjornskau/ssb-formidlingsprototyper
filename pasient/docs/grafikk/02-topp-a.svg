<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330"><title>Toppgrafikk A: flere pasienter, ikke flere innleggelser</title><rect width="1200" height="330" fill="#ffffff"/><text x="40.0" y="42.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#5e787a" text-anchor="start" style="font-variant-numeric:tabular-nums">PASIENTER I SPESIALISTHELSETJENESTEN · SOMATIKK 2015–2025</text><text x="40.0" y="112.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="60" font-weight="700" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">2,7 millioner</text><text x="40.0" y="150.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">fikk somatisk behandling i 2025, 16 prosent flere</text><text x="40.0" y="176.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">enn i 2015.</text><text x="40.0" y="212.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#5e787a" text-anchor="start" style="font-variant-numeric:tabular-nums">Veksten er poliklinisk: 27 prosent flere kontakter, men like</text><text x="40.0" y="233.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#5e787a" text-anchor="start" style="font-variant-numeric:tabular-nums">mange innleggelser som i 2015.</text><text x="40.0" y="258.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#5e787a" text-anchor="start" style="font-variant-numeric:tabular-nums">Oppholdsdøgnene på sykehus er 9 prosent færre.</text><text x="40.0" y="312.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#5e787a" text-anchor="start" style="font-variant-numeric:tabular-nums">Kilde: SSB, tabell 14824. Sist oppdatert: 22.06.2026.</text><text x="654.0" y="54.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#5e787a" text-anchor="start" style="font-variant-numeric:tabular-nums">indeks, 2015 = 100</text><line x1="690.0" y1="246.0" x2="1020.0" y2="246.0" stroke="#d9dfe0" stroke-width="1"/><text x="682.0" y="250.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#5e787a" text-anchor="end" style="font-variant-numeric:tabular-nums">90</text><line x1="690.0" y1="202.0" x2="1020.0" y2="202.0" stroke="#a9b5b7" stroke-width="1.2"/><text x="682.0" y="206.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#5e787a" text-anchor="end" style="font-variant-numeric:tabular-nums">100</text><line x1="690.0" y1="158.0" x2="1020.0" y2="158.0" stroke="#d9dfe0" stroke-width="1"/><text x="682.0" y="162.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#5e787a" text-anchor="end" style="font-variant-numeric:tabular-nums">110</text><line x1="690.0" y1="114.0" x2="1020.0" y2="114.0" stroke="#d9dfe0" stroke-width="1"/><text x="682.0" y="118.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#5e787a" text-anchor="end" style="font-variant-numeric:tabular-nums">120</text><line x1="690.0" y1="70.0" x2="1020.0" y2="70.0" stroke="#d9dfe0" stroke-width="1"/><text x="682.0" y="74.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#5e787a" text-anchor="end" style="font-variant-numeric:tabular-nums">130</text><text x="690.0" y="286.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#5e787a" text-anchor="middle" style="font-variant-numeric:tabular-nums">2015</text><text x="855.0" y="286.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#5e787a" text-anchor="middle" style="font-variant-numeric:tabular-nums">2020</text><text x="1020.0" y="286.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#5e787a" text-anchor="middle" style="font-variant-numeric:tabular-nums">2025</text><line x1="855.0" y1="70.0" x2="855.0" y2="268.0" stroke="#d9dfe0" stroke-width="1" stroke-dasharray="5 4"/><text x="860.0" y="80.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#5e787a" text-anchor="start" style="font-variant-numeric:tabular-nums">Korona</text><polyline points="690.0,202.0 723.0,189.7 756.0,174.9 789.0,165.1 822.0,153.7 855.0,172.6 888.0,140.5 921.0,135.0 954.0,120.4 987.0,107.3 1020.0,84.9" fill="none" stroke="#00824d" stroke-width="2.5" stroke-linejoin="round"/><circle cx="1020.0" cy="84.9" r="4" fill="#00824d" stroke="none" stroke-width="1"/><text x="1030.0" y="85.9" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">Polikliniske kontakter</text><text x="1030.0" y="100.9" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">127</text><polyline points="690.0,202.0 723.0,192.5 756.0,184.0 789.0,178.1 822.0,173.1 855.0,184.2 888.0,167.0 921.0,158.2 954.0,149.2 987.0,141.7 1020.0,130.5" fill="none" stroke="#1d9de2" stroke-width="2.5" stroke-linejoin="round"/><circle cx="1020.0" cy="130.5" r="4" fill="#1d9de2" stroke="none" stroke-width="1"/><text x="1030.0" y="131.5" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">Pasienter</text><text x="1030.0" y="146.5" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#274246" text-anch