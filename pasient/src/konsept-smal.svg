<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1158" viewBox="0 0 390 1158"><title>Slik lages tallene</title><rect width="390" height="1158" fill="#ffffff"/><text x="16.0" y="38.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">Slik lages tallene</text><text x="16.0" y="64.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#5e787a" text-anchor="start" style="font-variant-numeric:tabular-nums">Fra behandling i spesialisthelsetjenesten</text><text x="16.0" y="83.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#5e787a" text-anchor="start" style="font-variant-numeric:tabular-nums">til tallene i statistikken</text><line x1="16.0" y1="97.0" x2="374.0" y2="97.0" stroke="#cdd3d4" stroke-width="1"/><rect x="16.0" y="115.0" width="358.0" height="173.0" fill="#eff8fa" stroke="#c4dddb" stroke-width="1"/><circle cx="40.0" cy="141.0" r="15" fill="#274246" stroke="none" stroke-width="1"/><text x="40.0" y="147.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle" style="font-variant-numeric:tabular-nums">1</text><text x="66.0" y="147.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#1e3a3f" text-anchor="start" style="font-variant-numeric:tabular-nums">Behandlingen registreres</text><text x="66.0" y="172.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">Sykehus, private institusjoner med</text><text x="66.0" y="191.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">avtale og avtalespesialister</text><text x="66.0" y="210.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">rapporterer hver kontakt til Norsk</text><text x="66.0" y="229.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">pasientregister.</text><text x="66.0" y="254.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#00824d" text-anchor="start" style="font-variant-numeric:tabular-nums">9 790 080 polikliniske kontakter i</text><text x="66.0" y="271.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#00824d" text-anchor="start" style="font-variant-numeric:tabular-nums">2025</text><line x1="195.0" y1="291.0" x2="195.0" y2="304.0" stroke="#5e787a" stroke-width="2"/><polygon points="195.0,313.0 199.9,304.0 190.1,304.0" fill="#5e787a"/><rect x="16.0" y="316.0" width="358.0" height="156.0" fill="#eff8fa" stroke="#c4dddb" stroke-width="1"/><circle cx="40.0" cy="342.0" r="15" fill="#274246" stroke="none" stroke-width="1"/><text x="40.0" y="348.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle" style="font-variant-numeric:tabular-nums">2</text><text x="66.0" y="348.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#1e3a3f" text-anchor="start" style="font-variant-numeric:tabular-nums">Koblet til person</text><text x="66.0" y="373.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">SSB kobler kontaktene til</text><text x="66.0" y="392.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">befolkningsregisteret. Kontakter uten</text><text x="66.0" y="411.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">gyldig fødsels- eller D-nummer faller</text><text x="66.0" y="430.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">ut.</text><text x="66.0" y="455.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#00824d" text-anchor="start" style="font-variant-numeric:tabular-nums">13 500 kontakter uten personnummer</text><line x1="195.0" y1="475.0" x2="195.0" y2="488.0" stroke="#5e787a" stroke-width="2"/><polygon points="195.0,497.0 199.9,488.0 190.1,488.0" fill="#5e787a"/><rect x="16.0" y="500.0" width="358.0" height="137.0" fill="#eff8fa" stroke="#c4dddb" stroke-width="1"/><circle cx="40.0" cy="526.0" r="15" fill="#274246" stroke="none" stroke-width="1"/><text x="40.0" y="532.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle" style="font-variant-numeric:tabular-nums">3</text><text x="66.0" y="532.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#1e3a3f" text-anchor="start" style="font-variant-numeric:tabular-nums">Kontakter blir pasienter</text><text x="66.0" y="557.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">Hver person telles én gang, uansett</text><text x="66.0" y="576.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">hvor mange kontakter eller</text><text x="66.0" y="595.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">innleggelser den har hatt.</text><text x="66.0" y="620.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#00824d" text-anchor="start" style="font-variant-numeric:tabular-nums">2 716 218 pasienter i 2025</text><line x1="195.0" y1="640.0" x2="195.0" y2="653.0" stroke="#5e787a" stroke-width="2"/><polygon points="195.0,662.0 199.9,653.0 190.1,653.0" fill="#5e787a"/><rect x="16.0" y="665.0" width="358.0" height="137.0" fill="#eff8fa" stroke="#c4dddb" stroke-width="1"/><circle cx="40.0" cy="691.0" r="15" fill="#274246" stroke="none" stroke-width="1"/><text x="40.0" y="697.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle" style="font-variant-numeric:tabular-nums">4</text><text x="66.0" y="697.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#1e3a3f" text-anchor="start" style="font-variant-numeric:tabular-nums">Én gang per gruppe</text><text x="66.0" y="722.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">En person med to diagnoser telles i</text><text x="66.0" y="741.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">begge. Gruppene summerer derfor til</text><text x="66.0" y="760.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">mer enn totalen.</text><text x="66.0" y="785.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#00824d" text-anchor="start" style="font-variant-numeric:tabular-nums">Diagnosekapitlene: 5,16 mill.</text><line x1="195.0" y1="805.0" x2="195.0" y2="818.0" stroke="#5e787a" stroke-width="2"/><polygon points="195.0,827.0 199.9,818.0 190.1,818.0" fill="#5e787a"/><rect x="16.0" y="830.0" width="358.0" height="137.0" fill="#eff8fa" stroke="#c4dddb" stroke-width="1"/><circle cx="40.0" cy="856.0" r="15" fill="#274246" stroke="none" stroke-width="1"/><text x="40.0" y="862.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle" style="font-variant-numeric:tabular-nums">5</text><text x="66.0" y="862.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#1e3a3f" text-anchor="start" style="font-variant-numeric:tabular-nums">Avrundet og satt i forhold</text><text x="66.0" y="887.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">Pasienttall avrundes til nærmeste tall</text><text x="66.0" y="906.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">delelig med 3. Rater regnes per 1 000</text><text x="66.0" y="925.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">innbyggere.</text><text x="66.0" y="950.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#00824d" text-anchor="start" style="font-variant-numeric:tabular-nums">484 per 1 000 innbyggere</text><rect x="16.0" y="987.0" width="358.0" height="70.0" fill="#f3f5f5" stroke="#b9c5c6" stroke-width="1.2" stroke-dasharray="6 4"/><text x="28.0" y="1007.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#5e787a" text-anchor="start" style="font-variant-numeric:tabular-nums">Ikke med: psykisk helsevern for barn og unge ·</text><text x="28.0" y="1025.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#5e787a" text-anchor="start" style="font-variant-numeric:tabular-nums">tverrfaglig rusbehandling · fastlege og</text><text x="28.0" y="1043.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#5e787a" text-anchor="start" style="font-variant-numeric:tabular-nums">kommunale tjenester · ventetid og kostnader</text><text x="16.0" y="1079.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" fill="#5e787a" text-anchor="start" style="font-variant-numeric:tabular-nums">Kilde: SSB, Om statistikken for Pasienter i</text><text x="16.0" y="1094.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" fill="#5e787a" text-anchor="start" style="font-variant-numeric:tabular-nums">spesialisthelsetjenesten (19.06.2026); tabell 14824 og</text><text x="16.0" y="1109.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" fill="#5e787a" text-anchor="start" style="font-variant-numeric:tabular-nums">14827. Tallene gjelder somatikk, 2025.</text></svg>