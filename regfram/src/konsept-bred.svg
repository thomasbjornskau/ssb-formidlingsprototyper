<text x="70.0" y="542.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="18" font-weight="700" fill="#274246" text-anchor="start">Ikke med før det synes i statistikken</text><text x="70.0" y="568.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#5e787a" text-anchor="start">Planlagte boligfelt, nye arbeidsplasser, nedleggelser og asylmottak påvirker ikke tallene</text><text x="70.0" y="588.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#5e787a" text-anchor="start">før de har satt spor i den registrerte utviklingen. Lokal kunnskap må legges til av den som bruker tallene.</text></svg>