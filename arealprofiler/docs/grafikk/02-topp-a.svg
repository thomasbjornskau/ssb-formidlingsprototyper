<text x="620.0" y="298.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#5e787a" text-anchor="start" style="font-variant-numeric:tabular-nums">Årstallet er slutten av fireårsperioden. Kommunenes andeler er vektet med antall nye boliger.</text>
