<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330"><title>Toppgrafikk B: hvilken lønn</title><rect width="1200" height="330" fill="#ffffff"/><text x="40.0" y="42.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#5e787a" text-anchor="start" style="font-variant-numeric:tabular-nums">ANTALL ARBEIDSFORHOLD OG LØNN · 2. KVARTAL 2026</text><text x="40.0" y="112.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="60" font-weight="700" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">59 000 kroner</text><text x="40.0" y="150.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">er om lag snittet for avtalt månedslønn, før skatt.</text><text x="40.0" y="186.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#5e787a" text-anchor="start" style="font-variant-numeric:tabular-nums">Halvparten ligger under 53 650 kroner (median). Med bonus og</text><text x="40.0" y="207.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#5e787a" text-anchor="start" style="font-variant-numeric:tabular-nums">uregelmessige tillegg blir snittet 63 700 kroner.</text><text x="40.0" y="232.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#5e787a" text-anchor="start" style="font-variant-numeric:tabular-nums">Alle tallene er regnet om til heltid.</text><text x="40.0" y="312.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#5e787a" text-anchor="start" style="font-variant-numeric:tabular-nums">Kilde: SSB, tabell 11652. Sist oppdatert: 13.08.2026.</text><text x="790.0" y="60.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#5e787a" text-anchor="start" style="font-variant-numeric:tabular-nums">kroner per måned, heltid</text><line x1="790.0" y1="70.0" x2="790.0" y2="216.0" stroke="#d9dfe0" stroke-width="1"/><text x="790.0" y="235.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#5e787a" text-anchor="middle" style="font-variant-numeric:tabular-nums">0</text><line x1="870.0" y1="70.0" x2="870.0" y2="216.0" stroke="#d9dfe0" stroke-width="1"/><text x="870.0" y="235.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#5e787a" text-anchor="middle" style="font-variant-numeric:tabular-nums">20 000</text><line x1="950.0" y1="70.0" x2="950.0" y2="216.0" stroke="#d9dfe0" stroke-width="1"/><text x="950.0" y="235.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#5e787a" text-anchor="middle" style="font-variant-numeric:tabular-nums">40 000</text><line x1="1030.0" y1="70.0" x2="1030.0" y2="216.0" stroke="#d9dfe0" stroke-width="1"/><text x="1030.0" y="235.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#5e787a" text-anchor="middle" style="font-variant-numeric:tabular-nums">60 000</text><rect x="790.0" y="74.0" width="214.6" height="34.0" fill="#00824d" stroke="none" stroke-width="1"/><text x="780.0" y="87.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#274246" text-anchor="end" style="font-variant-numeric:tabular-nums">Median avtalt</text><text x="780.0" y="105.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#274246" text-anchor="end" style="font-variant-numeric:tabular-nums">månedslønn</text><text x="1012.6" y="96.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">53 650 kr</text><rect x="790.0" y="125.0" width="235.9" height="34.0" fill="#00824d" stroke="none" stroke-width="1"/><text x="780.0" y="138.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#274246" text-anchor="end" style="font-variant-numeric:tabular-nums">Snitt avtalt</text><text x="780.0" y="156.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#274246" text-anchor="end" style="font-variant-numeric:tabular-nums">månedslønn</text><text x="1033.9" y="147.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">58 970 kr</text><rect x="790.0" y="176.0" width="254.8" height="34.0" fill="#00824d" stroke="none" stroke-width="1"/><text x="780.0" y="189.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#274246" text-anchor="end" style="font-variant-numeric:tabular-nums">Snitt månedslønn (med</text><text x="780.0" y="207.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#274246" text-anchor="end" style="font-variant-numeric:tabular-nums">bonus og tillegg)</text><text x="1052.8" y="198.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">63 700 kr</text><line x1="790.0" y1="70.0" x2="790.0" y2="216.0" stroke="#a9b5b7" stroke-width="1.2"/></svg>