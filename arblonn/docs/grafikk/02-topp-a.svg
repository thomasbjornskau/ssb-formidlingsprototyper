<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330"><title>Toppgrafikk A: jobber og mennesker</title><rect width="1200" height="330" fill="#ffffff"/><text x="40.0" y="42.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#5e787a" text-anchor="start" style="font-variant-numeric:tabular-nums">ANTALL ARBEIDSFORHOLD OG LØNN · 2. KVARTAL 2026</text><text x="40.0" y="112.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="54" font-weight="700" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">3,2 millioner jobber</text><text x="40.0" y="150.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="20" font-weight="400" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">men 2,8 millioner mennesker har dem.</text><text x="40.0" y="186.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#5e787a" text-anchor="start" style="font-variant-numeric:tabular-nums">En person kan ha flere jobber. Lønnstakere telles én gang, med</text><text x="40.0" y="207.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#5e787a" text-anchor="start" style="font-variant-numeric:tabular-nums">hovedjobben.</text><text x="40.0" y="232.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#5e787a" text-anchor="start" style="font-variant-numeric:tabular-nums">Regnet om til heltid blir jobbene 2,5 millioner månedsverk.</text><text x="40.0" y="312.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#5e787a" text-anchor="start" style="font-variant-numeric:tabular-nums">Kilde: SSB, tabell 11652. Sist oppdatert: 13.08.2026.</text><text x="790.0" y="60.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#5e787a" text-anchor="start" style="font-variant-numeric:tabular-nums">antall, millioner</text><line x1="790.0" y1="70.0" x2="790.0" y2="216.0" stroke="#d9dfe0" stroke-width="1"/><text x="790.0" y="235.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#5e787a" text-anchor="middle" style="font-variant-numeric:tabular-nums">0</text><line x1="875.7" y1="70.0" x2="875.7" y2="216.0" stroke="#d9dfe0" stroke-width="1"/><text x="875.7" y="235.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#5e787a" text-anchor="middle" style="font-variant-numeric:tabular-nums">1</text><line x1="961.4" y1="70.0" x2="961.4" y2="216.0" stroke="#d9dfe0" stroke-width="1"/><text x="961.4" y="235.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#5e787a" text-anchor="middle" style="font-variant-numeric:tabular-nums">2</text><line x1="1047.1" y1="70.0" x2="1047.1" y2="216.0" stroke="#d9dfe0" stroke-width="1"/><text x="1047.1" y="235.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#5e787a" text-anchor="middle" style="font-variant-numeric:tabular-nums">3</text><rect x="790.0" y="74.0" width="271.5" height="34.0" fill="#00824d" stroke="none" stroke-width="1"/><text x="780.0" y="96.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#274246" text-anchor="end" style="font-variant-numeric:tabular-nums">Jobber</text><text x="1069.5" y="96.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">3 166 971</text><rect x="790.0" y="125.0" width="243.4" height="34.0" fill="#00824d" stroke="none" stroke-width="1"/><text x="780.0" y="147.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#274246" text-anchor="end" style="font-variant-numeric:tabular-nums">Lønnstakere (personer)</text><text x="1041.4" y="147.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">2 839 248</text><rect x="790.0" y="176.0" width="211.5" height="34.0" fill="#00824d" stroke="none" stroke-width="1"/><text x="780.0" y="198.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#274246" text-anchor="end" style="font-variant-numeric:tabular-nums">Heltidsekvivalenter</text><text x="1009.5" y="198.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">2 468 029</text><line x1="790.0" y1="70.0" x2="790.0" y2="216.0" stroke="#a9b5b7" stroke-width="1.2"/></svg>