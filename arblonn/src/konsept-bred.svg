<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="541" viewBox="0 0 1200 541"><title>Slik lages tallene</title><rect width="1200" height="541" fill="#ffffff"/><text x="40.0" y="50.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="28" font-weight="700" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">Slik lages tallene</text><text x="40.0" y="80.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="400" fill="#5e787a" text-anchor="start" style="font-variant-numeric:tabular-nums">Fra a-meldingen til tallene i statistikken</text><line x1="40.0" y1="96.0" x2="1160.0" y2="96.0" stroke="#cdd3d4" stroke-width="1"/><rect x="40.0" y="122.0" width="201.6" height="319.0" fill="#eff8fa" stroke="#c4dddb" stroke-width="1"/><circle cx="66.0" cy="152.0" r="15" fill="#274246" stroke="none" stroke-width="1"/><text x="66.0" y="158.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle" style="font-variant-numeric:tabular-nums">1</text><text x="90.0" y="149.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#1e3a3f" text-anchor="start" style="font-variant-numeric:tabular-nums">Arbeidsgiveren</text><text x="90.0" y="169.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#1e3a3f" text-anchor="start" style="font-variant-numeric:tabular-nums">melder</text><text x="54.0" y="199.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">Hver måned sender alle</text><text x="54.0" y="218.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">arbeidsgivere a-melding</text><text x="54.0" y="237.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">med arbeidsforhold,</text><text x="54.0" y="256.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">lønn og</text><text x="54.0" y="275.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">stillingsprosent.</text><rect x="50.0" y="396.0" width="181.6" height="35.0" fill="#ecfeed" stroke="#00824d" stroke-width="1"/><text x="58.0" y="416.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#00824d" text-anchor="start" style="font-variant-numeric:tabular-nums">Fulltelling, ikke utvalg</text><line x1="244.6" y1="281.5" x2="257.6" y2="281.5" stroke="#5e787a" stroke-width="2"/><polygon points="266.6,281.5 257.6,276.6 257.6,286.4" fill="#5e787a"/><rect x="269.6" y="122.0" width="201.6" height="319.0" fill="#eff8fa" stroke="#c4dddb" stroke-width="1"/><circle cx="295.6" cy="152.0" r="15" fill="#274246" stroke="none" stroke-width="1"/><text x="295.6" y="158.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle" style="font-variant-numeric:tabular-nums">2</text><text x="319.6" y="149.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#1e3a3f" text-anchor="start" style="font-variant-numeric:tabular-nums">SSB teller</text><text x="319.6" y="169.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#1e3a3f" text-anchor="start" style="font-variant-numeric:tabular-nums">aktive jobber</text><text x="283.6" y="199.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">En jobb telles når det</text><text x="283.6" y="218.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">er lønn eller ytelse i</text><text x="283.6" y="237.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">uka med den 16. i</text><text x="283.6" y="256.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">måneden.</text><rect x="279.6" y="379.0" width="181.6" height="52.0" fill="#ecfeed" stroke="#00824d" stroke-width="1"/><text x="287.6" y="399.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#00824d" text-anchor="start" style="font-variant-numeric:tabular-nums">Sesongjobb uten lønn den</text><text x="287.6" y="416.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#00824d" text-anchor="start" style="font-variant-numeric:tabular-nums">uka faller ut</text><line x1="474.2" y1="281.5" x2="487.2" y2="281.5" stroke="#5e787a" stroke-width="2"/><polygon points="496.2,281.5 487.2,276.6 487.2,286.4" fill="#5e787a"/><rect x="499.2" y="122.0" width="201.6" height="319.0" fill="#eff8fa" stroke="#c4dddb" stroke-width="1"/><circle cx="525.2" cy="152.0" r="15" fill="#274246" stroke="none" stroke-width="1"/><text x="525.2" y="158.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle" style="font-variant-numeric:tabular-nums">3</text><text x="549.2" y="149.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#1e3a3f" text-anchor="start" style="font-variant-numeric:tabular-nums">Jobber blir</text><text x="549.2" y="169.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#1e3a3f" text-anchor="start" style="font-variant-numeric:tabular-nums">lønnstakere</text><text x="513.2" y="199.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">Hver person telles én</text><text x="513.2" y="218.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">gang, med én hovedjobb.</text><rect x="509.2" y="379.0" width="181.6" height="52.0" fill="#ecfeed" stroke="#00824d" stroke-width="1"/><text x="517.2" y="399.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#00824d" text-anchor="start" style="font-variant-numeric:tabular-nums">3 166 971 jobber,</text><text x="517.2" y="416.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#00824d" text-anchor="start" style="font-variant-numeric:tabular-nums">2 839 248 lønnstakere</text><line x1="703.8" y1="281.5" x2="716.8" y2="281.5" stroke="#5e787a" stroke-width="2"/><polygon points="725.8,281.5 716.8,276.6 716.8,286.4" fill="#5e787a"/><rect x="728.8" y="122.0" width="201.6" height="319.0" fill="#eff8fa" stroke="#c4dddb" stroke-width="1"/><circle cx="754.8" cy="152.0" r="15" fill="#274246" stroke="none" stroke-width="1"/><text x="754.8" y="158.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle" style="font-variant-numeric:tabular-nums">4</text><text x="778.8" y="149.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#1e3a3f" text-anchor="start" style="font-variant-numeric:tabular-nums">Lønna regnes om</text><text x="778.8" y="169.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#1e3a3f" text-anchor="start" style="font-variant-numeric:tabular-nums">til heltid</text><text x="742.8" y="199.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">Avtalt månedslønn og</text><text x="742.8" y="218.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">månedslønn regnes per</text><text x="742.8" y="237.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">heltidsekvivalent.</text><text x="742.8" y="256.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">Kontantlønn regnes per</text><text x="742.8" y="275.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">jobb.</text><rect x="738.8" y="379.0" width="181.6" height="52.0" fill="#ecfeed" stroke="#00824d" stroke-width="1"/><text x="746.8" y="399.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#00824d" text-anchor="start" style="font-variant-numeric:tabular-nums">58 970 kr i avtalt</text><text x="746.8" y="416.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#00824d" text-anchor="start" style="font-variant-numeric:tabular-nums">månedslønn</text><line x1="933.4" y1="281.5" x2="946.4" y2="281.5" stroke="#5e787a" stroke-width="2"/><polygon points="955.4,281.5 946.4,276.6 946.4,286.4" fill="#5e787a"/><rect x="958.4" y="122.0" width="201.6" height="319.0" fill="#eff8fa" stroke="#c4dddb" stroke-width="1"/><circle cx="984.4" cy="152.0" r="15" fill="#274246" stroke="none" stroke-width="1"/><text x="984.4" y="158.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle" style="font-variant-numeric:tabular-nums">5</text><text x="1008.4" y="149.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#1e3a3f" text-anchor="start" style="font-variant-numeric:tabular-nums">Først</text><text x="1008.4" y="169.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#1e3a3f" text-anchor="start" style="font-variant-numeric:tabular-nums">foreløpig, så</text><text x="1008.4" y="189.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#1e3a3f" text-anchor="start" style="font-variant-numeric:tabular-nums">endelig</text><text x="972.4" y="219.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">Første tall kommer 3–4</text><text x="972.4" y="238.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">uker etter måneden.</text><text x="972.4" y="257.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">Endelige tall kommer en</text><text x="972.4" y="276.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">måned senere, med</text><text x="972.4" y="295.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">forsinkede meldinger og</text><text x="972.4" y="314.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">rettinger.</text><rect x="968.4" y="345.0" width="181.6" height="86.0" fill="#ecfeed" stroke="#00824d" stroke-width="1"/><text x="976.4" y="365.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#00824d" text-anchor="start" style="font-variant-numeric:tabular-nums">August 2026,</text><text x="976.4" y="382.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#00824d" text-anchor="start" style="font-variant-numeric:tabular-nums">sesongjustert: endelig</text><text x="976.4" y="399.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#00824d" text-anchor="start" style="font-variant-numeric:tabular-nums">tall 67 276 jobber</text><text x="976.4" y="416.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#00824d" text-anchor="start" style="font-variant-numeric:tabular-nums">høyere</text><rect x="40.0" y="463.0" width="1120.0" height="40.0" fill="#f3f5f5" stroke="#b9c5c6" stroke-width="1.2" stroke-dasharray="6 4"/><text x="56.0" y="489.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#5e787a" text-anchor="start" style="font-variant-numeric:tabular-nums">Ikke med: selvstendig næringsdrivende · frilansere og oppdragstakere uten lønn i uka · småbeløp under fritaksgrensene i a-ordningen</text><text x="40.0" y="525.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#5e787a" text-anchor="start" style="font-variant-numeric:tabular-nums">Kilde: SSB, Om statistikken for Antall arbeidsforhold og lønn; tabell 11652 (2. kvartal 2026) og 13126 (sesongjustert).</text></svg>