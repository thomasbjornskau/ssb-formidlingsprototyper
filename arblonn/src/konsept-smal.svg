<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1116" viewBox="0 0 390 1116"><title>Slik lages tallene</title><rect width="390" height="1116" fill="#ffffff"/><text x="16.0" y="38.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="24" font-weight="700" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">Slik lages tallene</text><text x="16.0" y="64.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#5e787a" text-anchor="start" style="font-variant-numeric:tabular-nums">Fra a-meldingen til tallene</text><line x1="16.0" y1="78.0" x2="374.0" y2="78.0" stroke="#cdd3d4" stroke-width="1"/><rect x="16.0" y="96.0" width="358.0" height="137.0" fill="#eff8fa" stroke="#c4dddb" stroke-width="1"/><circle cx="40.0" cy="122.0" r="15" fill="#274246" stroke="none" stroke-width="1"/><text x="40.0" y="128.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle" style="font-variant-numeric:tabular-nums">1</text><text x="66.0" y="128.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#1e3a3f" text-anchor="start" style="font-variant-numeric:tabular-nums">Arbeidsgiveren melder</text><text x="66.0" y="153.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">Hver måned sender alle arbeidsgivere</text><text x="66.0" y="172.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">a-melding med arbeidsforhold, lønn og</text><text x="66.0" y="191.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">stillingsprosent.</text><text x="66.0" y="216.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#00824d" text-anchor="start" style="font-variant-numeric:tabular-nums">Fulltelling, ikke utvalg</text><line x1="195.0" y1="236.0" x2="195.0" y2="249.0" stroke="#5e787a" stroke-width="2"/><polygon points="195.0,258.0 199.9,249.0 190.1,249.0" fill="#5e787a"/><rect x="16.0" y="261.0" width="358.0" height="135.0" fill="#eff8fa" stroke="#c4dddb" stroke-width="1"/><circle cx="40.0" cy="287.0" r="15" fill="#274246" stroke="none" stroke-width="1"/><text x="40.0" y="293.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle" style="font-variant-numeric:tabular-nums">2</text><text x="66.0" y="293.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#1e3a3f" text-anchor="start" style="font-variant-numeric:tabular-nums">SSB teller aktive jobber</text><text x="66.0" y="318.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">En jobb telles når det er lønn eller</text><text x="66.0" y="337.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">ytelse i uka med den 16. i måneden.</text><text x="66.0" y="362.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#00824d" text-anchor="start" style="font-variant-numeric:tabular-nums">Sesongjobb uten lønn den uka faller</text><text x="66.0" y="379.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#00824d" text-anchor="start" style="font-variant-numeric:tabular-nums">ut</text><line x1="195.0" y1="399.0" x2="195.0" y2="412.0" stroke="#5e787a" stroke-width="2"/><polygon points="195.0,421.0 199.9,412.0 190.1,412.0" fill="#5e787a"/><rect x="16.0" y="424.0" width="358.0" height="135.0" fill="#eff8fa" stroke="#c4dddb" stroke-width="1"/><circle cx="40.0" cy="450.0" r="15" fill="#274246" stroke="none" stroke-width="1"/><text x="40.0" y="456.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle" style="font-variant-numeric:tabular-nums">3</text><text x="66.0" y="456.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#1e3a3f" text-anchor="start" style="font-variant-numeric:tabular-nums">Jobber blir lønnstakere</text><text x="66.0" y="481.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">Hver person telles én gang, med én</text><text x="66.0" y="500.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">hovedjobb.</text><text x="66.0" y="525.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#00824d" text-anchor="start" style="font-variant-numeric:tabular-nums">3 166 971 jobber, 2 839 248</text><text x="66.0" y="542.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#00824d" text-anchor="start" style="font-variant-numeric:tabular-nums">lønnstakere</text><line x1="195.0" y1="562.0" x2="195.0" y2="575.0" stroke="#5e787a" stroke-width="2"/><polygon points="195.0,584.0 199.9,575.0 190.1,575.0" fill="#5e787a"/><rect x="16.0" y="587.0" width="358.0" height="137.0" fill="#eff8fa" stroke="#c4dddb" stroke-width="1"/><circle cx="40.0" cy="613.0" r="15" fill="#274246" stroke="none" stroke-width="1"/><text x="40.0" y="619.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle" style="font-variant-numeric:tabular-nums">4</text><text x="66.0" y="619.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#1e3a3f" text-anchor="start" style="font-variant-numeric:tabular-nums">Lønna regnes om til heltid</text><text x="66.0" y="644.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">Avtalt månedslønn og månedslønn regnes</text><text x="66.0" y="663.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">per heltidsekvivalent. Kontantlønn</text><text x="66.0" y="682.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">regnes per jobb.</text><text x="66.0" y="707.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#00824d" text-anchor="start" style="font-variant-numeric:tabular-nums">58 970 kr i avtalt månedslønn</text><line x1="195.0" y1="727.0" x2="195.0" y2="740.0" stroke="#5e787a" stroke-width="2"/><polygon points="195.0,749.0 199.9,740.0 190.1,740.0" fill="#5e787a"/><rect x="16.0" y="752.0" width="358.0" height="173.0" fill="#eff8fa" stroke="#c4dddb" stroke-width="1"/><circle cx="40.0" cy="778.0" r="15" fill="#274246" stroke="none" stroke-width="1"/><text x="40.0" y="784.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#ffffff" text-anchor="middle" style="font-variant-numeric:tabular-nums">5</text><text x="66.0" y="784.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#1e3a3f" text-anchor="start" style="font-variant-numeric:tabular-nums">Først foreløpig, så endelig</text><text x="66.0" y="809.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">Første tall kommer 3–4 uker etter</text><text x="66.0" y="828.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">måneden. Endelige tall kommer en måned</text><text x="66.0" y="847.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">senere, med forsinkede meldinger og</text><text x="66.0" y="866.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">rettinger.</text><text x="66.0" y="891.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#00824d" text-anchor="start" style="font-variant-numeric:tabular-nums">August 2026, sesongjustert: endelig</text><text x="66.0" y="908.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="700" fill="#00824d" text-anchor="start" style="font-variant-numeric:tabular-nums">tall 67 276 jobber høyere</text><rect x="16.0" y="945.0" width="358.0" height="70.0" fill="#f3f5f5" stroke="#b9c5c6" stroke-width="1.2" stroke-dasharray="6 4"/><text x="28.0" y="965.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#5e787a" text-anchor="start" style="font-variant-numeric:tabular-nums">Ikke med: selvstendig næringsdrivende ·</text><text x="28.0" y="983.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#5e787a" text-anchor="start" style="font-variant-numeric:tabular-nums">frilansere og oppdragstakere uten lønn i uka ·</text><text x="28.0" y="1001.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#5e787a" text-anchor="start" style="font-variant-numeric:tabular-nums">småbeløp under fritaksgrensene i a-ordningen</text><text x="16.0" y="1037.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" fill="#5e787a" text-anchor="start" style="font-variant-numeric:tabular-nums">Kilde: SSB, Om statistikken for Antall arbeidsforhold og</text><text x="16.0" y="1052.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" fill="#5e787a" text-anchor="start" style="font-variant-numeric:tabular-nums">lønn; tabell 11652 (2. kvartal 2026) og 13126</text><text x="16.0" y="1067.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="11" font-weight="400" fill="#5e787a" text-anchor="start" style="font-variant-numeric:tabular-nums">(sesongjustert).</text></svg>