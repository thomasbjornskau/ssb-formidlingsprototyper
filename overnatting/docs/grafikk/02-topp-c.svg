<text x="52.0" y="234.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#5e787a" text-anchor="start">Campingplassene hadde 18 547 færre overnattinger</text>
<rect x="40.0" y="248.0" width="3.0" height="14.0" rx="0" fill="#00824d" stroke="none" stroke-width="1"/>
<text x="52.0" y="259.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#5e787a" text-anchor="start">Utenlandske gjester registreres etter landet de bor i</text>
<text x="600.0" y="52.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#274247" text-anchor="start">Endring i antall overnattinger</text>
