<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330">
<title>Toppgrafikk C: utlendinger på hotell driver veksten</title>
<desc>Endring i overnattinger fra september 2025 til september 2026 etter innkvarteringstype og bostedsland.</desc>
<rect x="0.0" y="0.0" width="1200.0" height="330.0" rx="0" fill="#ffffff" stroke="none" stroke-width="1"/>
<text x="40.0" y="46.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#5e787a" text-anchor="start">OVERNATTINGAR · SEPTEMBER 2026 MOT SEPTEMBER 2025</text>
<text x="40.0" y="112.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="60" font-weight="700" fill="#274247" text-anchor="start" font-variant-numeric="tabular-nums">+58 000</text>
<text x="40.0" y="148.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#274247" text-anchor="start">flere utenlandske hotellovernattinger. Det er mer</text>
<text x="40.0" y="174.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#274247" text-anchor="start">enn hele veksten i kommersielle overnattinger, som</text>
<text x="40.0" y="200.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#274247" text-anchor="start">var +53 750.</text>
