<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330">
<title>Toppgrafikk B: 7 av 10 netter er ikke med</title>
<desc>Nordmenns overnattinger på reiser i Norge 2025 etter innkvarteringstype, og norske overnattinger i overnattingsstatistikken.</desc>
<rect x="0.0" y="0.0" width="1200.0" height="330.0" rx="0" fill="#ffffff" stroke="none" stroke-width="1"/>
<text x="40.0" y="46.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#5e787a" text-anchor="start">REISEUNDERSØKELSEN OG OVERNATTINGAR · 2025</text>
<text x="40.0" y="112.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="60" font-weight="700" fill="#274247" text-anchor="start" font-variant-numeric="tabular-nums">7 av 10</text>
<text x="40.0" y="148.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#274247" text-anchor="start">netter nordmenn sov borte på reiser i Norge, var i</text>
<text x="40.0" y="174.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#274247" text-anchor="start">ikke-kommersiell innkvartering. De er ikke med i</text>
<text x="40.0" y="200.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="19" font-weight="400" fill="#274247" text-anchor="start">overnattingsstatistikken.</text>
<rect x="40.0" y="223.0" width="3.0" height="14.0" rx="0" fill="#00824d" stroke="none" stroke-width="1"/>
<text x="52.0" y="234.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#5e787a" text-anchor="start">58,2 av 83,4 millioner overnattinger, ifølge Reiseundersøkelsen</text>
<rect x="40.0" y="248.0" width="3.0" height="14.0" rx="0" fill="#00824d" stroke="none" stroke-width="1"/>
<text x="52.0" y="259.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#5e787a" text-anchor="start">Overnattingsstatistikken teller hotell, camping, hyttegrender,</text>
<text x="52.0" y="280.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#5e787a" text-anchor="start">vandrerhjem og formidlede fritidsboliger</text>
<text x="600.0" y="52.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#274247" text-anchor="start">Nordmenns overnattinger på reiser i Norge</text>
<text x="600.0" y="72.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#5e787a" text-anchor="start">Reiseundersøkelsen, millioner overnattinger</text>
<rect x="600.0" y="98.0" width="169.3" height="46.0" rx="0" fill="#00824d" stroke="none" stroke-width="1"/>
<rect x="769.3" y="98.0" width="390.7" height="46.0" rx="0" fill="#cdd3d4" stroke="none" stroke-width="1"/>
<text x="610.0" y="127.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="start" font-variant-numeric="tabular-nums">25,2</text>
<text x="781.3" y="127.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#274247" text-anchor="start" font-variant-numeric="tabular-nums">Ikke-kommersiell: 58,2</text>
<text x="600.0" y="164.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#274247" text-anchor="start">Hotell, camping og annen</text>
<text x="600.0" y="181.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#274247" text-anchor="start">kommersiell innkvartering</text>
<text x="1160.0" y="164.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#5e787a" text-anchor="end" font-variant-numeric="tabular-nums">I alt 83,4</text>
<text x="600.0" y="218.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#274247" text-anchor="start">Norske overnattinger i overnattingsstatistikken</text>
<rect x="600.0" y="228.0" width="177.4" height="30.0" rx="0" fill="#00824d" stroke="none" stroke-width="1"/>
<text x="785.4" y="249.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#274247" text-anchor="start" font-variant-numeric="tabular-nums">26,4</text>
<text x="600.0" y="278.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#5e787a" text-anchor="start">To undersøkelser med ulike metoder. Bruk dem til å se størrelsene, ikke til å regne differanser.</text>
<line x1="600.0" y1="92.0" x2="600.0" y2="264.0" stroke="#a9b5b7" stroke-width="1"/>
<text x="1160.0" y="314.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#5e787a" text-anchor="end">Kilde: SSB, tabell 11270 (sist oppdatert 27.8.2026) og 14162 (sist oppdatert 4.11.2026).</text>
</svg>
