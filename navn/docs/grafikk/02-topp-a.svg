', 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#5e787a" text-anchor="middle" style="font-variant-numeric:tabular-nums">1920</text><text x="921.4" y="290.0" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#5e787a" text-anchor="middle" style="font-variant-numeric:tabular-nums">1960</text><text x="1062.1" y="290.0" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#5e787a" text-anchor="middle" style="font-variant-numeric:tabular-nums">2000</text><text x="1150.0" y="290.0" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#5e787a" text-anchor="middle" style="font-variant-numeric:tabular-nums">2025</text><line x1="868.6" y1="68.0" x2="868.6" y2="270.0" stroke="#a9b5b7" stroke-width="1" stroke-dasharray="4 4"/><line x1="935.4" y1="68.0" x2="935.4" y2="270.0" stroke="#a9b5b7" stroke-width="1" stroke-dasharray="4 4"/><text x="862.6" y="78.0" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#5e787a" text-anchor="end" style="font-variant-numeric:tabular-nums">Antall fra 1945</text><text x="941.4" y="78.0" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#5e787a" text-anchor="start" style="font-variant-numeric:tabular-nums">Full telling fra 1964</text><polyline points="640.0,107.3 643.5,83.9 647.0,104.4 650.6,96.7 654.1,106.1 657.6,102.0 661.1,105.0 664.6,109.2 668.1,114.1 671.7,116.1 675.2,116.2 678.7,118.0 682.2,128.9 685.7,124.4 689.2,131.2 692.8,133.1 696.3,141.8 699.8,146.2 703.3,153.7 706.8,160.3 710.3,170.8 713.9,174.0 717.4,170.9 720.9,178.2 724.4,178.1 727.9,181.6 731.4,183.0 735.0,188.2 738.5,191.3 742.0,193.9 745.5,195.9 749.0,205.7 752.6,199.4 756.1,206.2 759.6,207.8 763.1,213.2 766.6,208.9 770.1,215.8 773.7,215.3 777.2,216.3 780.7,218.6 784.2,224.1 787.7,222.5 791.2,224.4 794.8,226.4 798.3,228.7 801.8,235.1 8