<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330"><title>Toppgrafikk A: navnebølgen</title><rect width="1200" height="330" fill="#ffffff"/><text x="40.0" y="48.0" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#5e787a" text-anchor="start" style="font-variant-numeric:tabular-nums">NAVN · NYFØDTE · 1880–2025</text><text x="40.0" y="128.0" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="64" font-weight="700" fill="#00824d" text-anchor="start" style="font-variant-numeric:tabular-nums">9 av 100</text><text x="40.0" y="172.0" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="600" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">jenter fikk navnet Anna i 1881. I 2025 var det under</text><text x="40.0" y="199.0" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="600" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">1 av 100.</text><text x="40.0" y="236.0" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="400" fill="#5e787a" text-anchor="start" style="font-variant-numeric:tabular-nums">Velg et navn og se bølgen. Tall før 1964 er mindre presise, og før</text><text x="40.0" y="257.8" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="400" fill="#5e787a" text-anchor="start" style="font-variant-numeric:tabular-nums">1945 finnes bare andeler.</text><text x="40.0" y="314.0" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#5e787a" text-anchor="start" style="font-variant-numeric:tabular-nums">Kilde: SSB, tabell 10467. Sist oppdatert: 28.01.2026.</text><text x="640.0" y="42.0" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="400" fill="#5e787a" text-anchor="start" style="font-variant-numeric:tabular-nums"