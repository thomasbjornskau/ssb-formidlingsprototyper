<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330"><title>Toppgrafikk C: skrivemåtene</title><rect width="1200" height="330" fill="#ffffff"/><text x="40.0" y="48.0" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#5e787a" text-anchor="start" style="font-variant-numeric:tabular-nums">GUTTENAVN · 2025</text><text x="40.0" y="128.0" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="64" font-weight="700" fill="#00824d" text-anchor="start" style="font-variant-numeric:tabular-nums">411</text><text x="40.0" y="172.0" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="600" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">gutter fikk navnet Lucas i 2025. Men bare 225 av dem</text><text x="40.0" y="199.0" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="20" font-weight="600" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">skrives Lucas.</text><text x="40.0" y="236.0" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="400" fill="#5e787a" text-anchor="start" style="font-variant-numeric:tabular-nums">Topplisten slår sammen skrivemåter. I statistikkbanken står hver</text><text x="40.0" y="257.8" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="400" fill="#5e787a" text-anchor="start" style="font-variant-numeric:tabular-nums">skrivemåte for seg.</text><text x="40.0" y="314.0" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#5e787a" text-anchor="start" style="font-variant-numeric:tabular-nums">Kilde: SSB, artikkelen «Guttenavn» og tabell 10467. Sist oppdatert: 28.01.2026.</text><text x="700.0" y="42.0" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="400" fill="#5e787a" text-anchor="start" style="font-variant-numeric:tabular-nums">Antall nyfødte gutter, topp 5</text><rect x="905.0" y="30.0" width="12.0" height="12.0" fill="#339b71" stroke="none" stroke-width="1"/><text x="922.0" y="41.0" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#5e787a" text-anchor="start" style="font-variant-numeric:tabular-nums">vanligste skrivemåte</text><rect x="1052.0" y="30.0" width="12.0" height="12.0" fill="#d5a640" stroke="none" stroke-width="1"/><text x="1069.0" y="41.0" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#5e787a" text-anchor="start" style="font-variant-numeric:tabular-nums">andre skrivemåter</text><text x="690.0" y="83.0" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#274246" text-anchor="end" style="font-variant-numeric:tabular-nums">Noah</text><rect x="700.0" y="64.0" width="368.0" height="28.0" fill="#339b71" stroke="none" stroke-width="1"/><text x="706.0" y="83.0" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" fill="#ffffff" text-anchor="start" style="font-variant-numeric:tabular-nums">460</text><rect x="1068.0" y="64.0" width="13.6" height="28.0" fill="#d5a640" stroke="none" stroke-width="1"/><text x="1089.6" y="83.0" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">477</text><text x="690.0" y="124.0" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#274246" text-anchor="end" style="font-variant-numeric:tabular-nums">Jakob</text><rect x="700.0" y="105.0" width="237.6" height="28.0" fill="#339b71" stroke="none" stroke-width="1"/><text x="706.0" y="124.0" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="600" fill="#ffffff" text-anchor="start" style="font-variant-numeric:tabular-nums">297</text><rect 