<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1141" viewBox="0 0 390 1141"><title>Slik lages navnestatistikken</title><rect width="390" height="1141" fill="#ffffff"/><text x="20.0" y="36.0" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="22" font-weight="700" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">Slik lages tallene</text><text x="20.0" y="62.0" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#5e787a" text-anchor="start" style="font-variant-numeric:tabular-nums">Fra navnet blir registrert til det står i</text><text x="20.0" y="81.6" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#5e787a" text-anchor="start" style="font-variant-numeric:tabular-nums">statistikken</text><rect x="20.0" y="104.0" width="350.0" height="153.2" fill="#eff8fa" stroke="#c4dddb" stroke-width="1"/><circle cx="46.0" cy="132.0" r="15" fill="#274246" stroke="none" stroke-width="1"/><text x="46.0" y="137.0" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle" style="font-variant-numeric:tabular-nums">1</text><text x="70.0" y="138.0" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="700" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">Barnet får navn</text><text x="38.0" y="170.0" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">Foreldrene melder navnet til</text><text x="38.0" y="190.3" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">Folkeregisteret. Fra 2021 telles barnet i</text><text x="38.0" y="210.6" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">året det fikk navn, før det i året det ble</text><text x="38.0" y="230.9" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">født.</text><line x1="195.0" y1="261.2" x2="195.0" y2="283.2" stroke="#5e787a" stroke-width="1.5"/><polygon points="195.0,283.2 190.0,274.2 200.0,274.2" fill="#5e787a"/><rect x="20.0" y="287.2" width="350.0" height="132.9" fill="#eff8fa" stroke="#c4dddb" stroke-width="1"/><circle cx="46.0" cy="315.2" r="15" fill="#274246" stroke="none" stroke-width="1"/><text x="46.0" y="320.2" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle" style="font-variant-numeric:tabular-nums">2</text><text x="70.0" y="321.2" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="700" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">Kopi per 1. januar</text><text x="38.0" y="353.2" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">SSB bruker en kopi av Folkeregisteret per</text><text x="38.0" y="373.5" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">1. januar hvert år. Alle folkeregistrerte</text><text x="38.0" y="393.8" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">personer er med.</text><line x1="195.0" y1="424.1" x2="195.0" y2="446.1" stroke="#5e787a" stroke-width="1.5"/><polygon points="195.0,446.1 190.0,437.1 200.0,437.1" fill="#5e787a"/><rect x="20.0" y="450.1" width="350.0" height="194.9" fill="#eff8fa" stroke="#c4dddb" stroke-width="1"/><circle cx="46.0" cy="478.1" r="15" fill="#274246" stroke="none" stroke-width="1"/><text x="46.0" y="483.1" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle" style="font-variant-numeric:tabular-nums">3</text><text x="70.0" y="484.1" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="700" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">Skrivemåter ryddes</text><text x="38.0" y="516.1" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">Tegn utenfor det norske alfabetet slås</text><text x="38.0" y="536.4" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">sammen: É blir E, Ö blir Ø. Topplisten</text><text x="38.0" y="556.7" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">slår i tillegg sammen stavemåter:</text><text x="38.0" y="585.0" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">Lucas 225 + Lukas 186</text><text x="38.0" y="607.0" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="700" fill="#00824d" text-anchor="start" style="font-variant-numeric:tabular-nums">= 411 i topplisten</text><line x1="195.0" y1="649.0" x2="195.0" y2="671.0" stroke="#5e787a" stroke-width="1.5"/><polygon points="195.0,671.0 190.0,662.0 200.0,662.0" fill="#5e787a"/><rect x="20.0" y="675.0" width="350.0" height="210.9" fill="#eff8fa" stroke="#c4dddb" stroke-width="1"/><circle cx="46.0" cy="703.0" r="15" fill="#274246" stroke="none" stroke-width="1"/><text x="46.0" y="708.0" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle" style="font-variant-numeric:tabular-nums">4</text><text x="70.0" y="709.0" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="700" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">To ulike tall</text><text x="38.0" y="741.0" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">Samme navn gir to svar. Populært: hvor</text><text x="38.0" y="761.3" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">mange nyfødte fikk det. Vanlig: hvor mange</text><text x="38.0" y="781.6" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">som heter det.</text><text x="38.0" y="809.9" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="400" fill="#5e787a" text-anchor="start" style="font-variant-numeric:tabular-nums">Anne, 2025</text><text x="38.0" y="835.9" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="700" fill="#00824d" text-anchor="start" style="font-variant-numeric:tabular-nums">31</text><text x="134.0" y="835.9" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="400" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">nyfødte fikk navnet</text><text x="38.0" y="865.9" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="700" fill="#00824d" text-anchor="start" style="font-variant-numeric:tabular-nums">55 625</text><text x="134.0" y="865.9" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="400" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">personer heter det</text><rect x="20.0" y="905.9" width="350.0" height="164.0" fill="#f3f5f5" stroke="#b9c5c6" stroke-width="1.2" stroke-dasharray="6 4"/><text x="36.0" y="929.9" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#5e787a" text-anchor="start" style="font-variant-numeric:tabular-nums">Ikke med: navn brukt av færre enn 200</text><text x="36.0" y="949.9" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#5e787a" text-anchor="start" style="font-variant-numeric:tabular-nums">personer er ikke i statistikkbanken, men</text><text x="36.0" y="969.9" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#5e787a" text-anchor="start" style="font-variant-numeric:tabular-nums">navnesøket på ssb.no viser navn med flere</text><text x="36.0" y="990.0" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#5e787a" text-anchor="start" style="font-variant-numeric:tabular-nums">enn tre bærere. Før 1945 finnes bare</text><text x="36.0" y="1010.0" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#5e787a" text-anchor="start" style="font-variant-numeric:tabular-nums">andeler, og før 1964 er tellingen ikke</text><text x="36.0" y="1030.0" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#5e787a" text-anchor="start" style="font-variant-numeric:tabular-nums">fullstendig. Betydning og opprinnelse er</text><text x="36.0" y="1050.0" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#5e787a" text-anchor="start" style="font-variant-numeric:tabular-nums">ikke en del av statistikken.</text><text x="20.0" y="1097.9" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#5e787a" text-anchor="start" style="font-variant-numeric:tabular-nums">Kilde: SSB, navnestatistikken, tabell 10467 og 10501.</text><text x="20.0" y="1114.7" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#5e787a" text-anchor="start" style="font-variant-numeric:tabular-nums">Sist oppdatert: 28.01.2026.</text></svg>