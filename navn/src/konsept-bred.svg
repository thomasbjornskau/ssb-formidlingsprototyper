<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="463" viewBox="0 0 1200 463"><title>Slik lages navnestatistikken</title><rect width="1200" height="463" fill="#ffffff"/><text x="40.0" y="44.0" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="700" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">Slik lages tallene</text><text x="40.0" y="72.0" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="400" fill="#5e787a" text-anchor="start" style="font-variant-numeric:tabular-nums">Fra navnet blir registrert til det står i statistikken</text><rect x="40.0" y="98.0" width="248.0" height="231.2" fill="#eff8fa" stroke="#c4dddb" stroke-width="1"/><circle cx="66.0" cy="126.0" r="15" fill="#274246" stroke="none" stroke-width="1"/><text x="66.0" y="131.0" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle" style="font-variant-numeric:tabular-nums">1</text><text x="90.0" y="132.0" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="700" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">Barnet får navn</text><text x="58.0" y="164.0" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">Foreldrene melder navnet til</text><text x="58.0" y="184.3" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">Folkeregisteret. Fra 2021</text><text x="58.0" y="204.6" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">telles barnet i året det fikk</text><text x="58.0" y="224.9" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">navn, før det i året det ble</text><text x="58.0" y="245.2" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">født.</text><line x1="294.0" y1="213.6" x2="318.0" y2="213.6" stroke="#5e787a" stroke-width="1.5"/><polygon points="318.0,213.6 309.0,208.6 309.0,218.6" fill="#5e787a"/><rect x="324.0" y="98.0" width="248.0" height="231.2" fill="#eff8fa" stroke="#c4dddb" stroke-width="1"/><circle cx="350.0" cy="126.0" r="15" fill="#274246" stroke="none" stroke-width="1"/><text x="350.0" y="131.0" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle" style="font-variant-numeric:tabular-nums">2</text><text x="374.0" y="132.0" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="700" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">Kopi per 1. januar</text><text x="342.0" y="164.0" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">SSB bruker en kopi av</text><text x="342.0" y="184.3" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">Folkeregisteret per 1. januar</text><text x="342.0" y="204.6" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">hvert år. Alle</text><text x="342.0" y="224.9" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">folkeregistrerte personer er</text><text x="342.0" y="245.2" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">med.</text><line x1="578.0" y1="213.6" x2="602.0" y2="213.6" stroke="#5e787a" stroke-width="1.5"/><polygon points="602.0,213.6 593.0,208.6 593.0,218.6" fill="#5e787a"/><rect x="608.0" y="98.0" width="248.0" height="231.2" fill="#eff8fa" stroke="#c4dddb" stroke-width="1"/><circle cx="634.0" cy="126.0" r="15" fill="#274246" stroke="none" stroke-width="1"/><text x="634.0" y="131.0" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle" style="font-variant-numeric:tabular-nums">3</text><text x="658.0" y="132.0" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="700" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">Skrivemåter ryddes</text><text x="626.0" y="164.0" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">Tegn utenfor det norske</text><text x="626.0" y="184.3" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">alfabetet slås sammen: É blir</text><text x="626.0" y="204.6" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">E, Ö blir Ø. Topplisten slår i</text><text x="626.0" y="224.9" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">tillegg sammen stavemåter:</text><text x="626.0" y="253.2" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">Lucas 225 + Lukas 186</text><text x="626.0" y="275.2" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="700" fill="#00824d" text-anchor="start" style="font-variant-numeric:tabular-nums">= 411 i topplisten</text><line x1="862.0" y1="213.6" x2="886.0" y2="213.6" stroke="#5e787a" stroke-width="1.5"/><polygon points="886.0,213.6 877.0,208.6 877.0,218.6" fill="#5e787a"/><rect x="892.0" y="98.0" width="248.0" height="231.2" fill="#eff8fa" stroke="#c4dddb" stroke-width="1"/><circle cx="918.0" cy="126.0" r="15" fill="#274246" stroke="none" stroke-width="1"/><text x="918.0" y="131.0" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle" style="font-variant-numeric:tabular-nums">4</text><text x="942.0" y="132.0" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="700" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">To ulike tall</text><text x="910.0" y="164.0" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">Samme navn gir to svar.</text><text x="910.0" y="184.3" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">Populært: hvor mange nyfødte</text><text x="910.0" y="204.6" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">fikk det. Vanlig: hvor mange</text><text x="910.0" y="224.9" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">som heter det.</text><text x="910.0" y="253.2" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="400" fill="#5e787a" text-anchor="start" style="font-variant-numeric:tabular-nums">Anne, 2025</text><text x="910.0" y="279.2" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="700" fill="#00824d" text-anchor="start" style="font-variant-numeric:tabular-nums">31</text><text x="1006.0" y="279.2" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="400" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">nyfødte fikk navnet</text><text x="910.0" y="309.2" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="24" font-weight="700" fill="#00824d" text-anchor="start" style="font-variant-numeric:tabular-nums">55 625</text><text x="1006.0" y="309.2" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="400" fill="#274246" text-anchor="start" style="font-variant-numeric:tabular-nums">personer heter det</text><rect x="40.0" y="353.2" width="1100.0" height="66.0" fill="#f3f5f5" stroke="#b9c5c6" stroke-width="1.2" stroke-dasharray="6 4"/><text x="58.0" y="379.2" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#5e787a" text-anchor="start" style="font-variant-numeric:tabular-nums">Ikke med: navn brukt av færre enn 200 personer er ikke i statistikkbanken, men navnesøket på ssb.no viser navn med flere enn tre bærere. Før 1945</text><text x="58.0" y="399.2" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="14" font-weight="400" fill="#5e787a" text-anchor="start" style="font-variant-numeric:tabular-nums">finnes bare andeler, og før 1964 er tellingen ikke fullstendig. Betydning og opprinnelse er ikke en del av statistikken.</text><text x="40.0" y="449.2" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#5e787a" text-anchor="start" style="font-variant-numeric:tabular-nums">Kilde: SSB, navnestatistikken, tabell 10467 og 10501. Sist oppdatert: 28.01.2026.</text></svg>