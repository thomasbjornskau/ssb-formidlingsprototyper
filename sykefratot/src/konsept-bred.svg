<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600"><title>Slik lages tallene: sykefraværsprosenten i fire trinn</title><rect x="0" y="0" width="1200" height="600" fill="#ffffff"/><text x="40.0" y="46.0" font-family="Roboto Condensed, Arial Narrow, Arial, sans-serif" font-size="30" font-stretch="condensed" font-weight="700" fill="#274247" text-anchor="start">Slik lages tallene</text><text x="40.0" y="74.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#5e787a" text-anchor="start">Sykefraværsprosenten for 3. kvartal 2026, i fire trinn</text><line x1="40.0" y1="92.0" x2="1160.0" y2="92.0" stroke="#c3dcdc" stroke-width="1"/><circle cx="55.0" cy="128.0" r="15" fill="#274247" stroke="none" stroke-width="1"/><text x="55.0" y="133.5" font-family="Roboto, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><text x="80.0" y="134.0" font-family="Roboto, Arial, sans-serif" font-size="18" font-weight="700" fill="#274247" text-anchor="start">Tre kilder</text><line x1="296.0" y1="128.0" x2="315.0" y2="128.0" stroke="#274247" stroke-width="2"/><polygon points="324.0,128.0 315.0,122.6 315.0,133.4" fill="#274247"/><circle cx="345.0" cy="128.0" r="15" fill="#274247" stroke="none" stroke-width="1"/><text x="345.0" y="133.5" font-family="Roboto, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><text x="370.0" y="134.0" font-family="Roboto, Arial, sans-serif" font-size="18" font-weight="700" fill="#274247" text-anchor="start">Tell tapte dagsverk</text><line x1="586.0" y1="128.0" x2="605.0" y2="128.0" stroke="#274247" stroke-width="2"/><polygon points="614.0,128.0 605.0,122.6 605.0,133.4" fill="#274247"/><circle cx="635.0" cy="128.0" r="15" fill="#274247" stroke="none" stroke-width="1"/><text x="635.0" y="133.5" font-family="Roboto, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><text x="660.0" y="134.0" font-family="Roboto, Arial, sans-serif" font-size="18" font-weight="700" fill="#274247" text-anchor="start">Del på avtalte dagsverk</text><line x1="876.0" y1="128.0" x2="895.0" y2="128.0" stroke="#274247" stroke-width="2"/><polygon points="904.0,128.0 895.0,122.6 895.0,133.4" fill="#274247"/><circle cx="925.0" cy="128.0" r="15" fill="#274247" stroke="none" stroke-width="1"/><text x="925.0" y="133.5" font-family="Roboto, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">4</text><text x="950.0" y="134.0" font-family="Roboto, Arial, sans-serif" font-size="18" font-weight="700" fill="#274247" text-anchor="start">Sesongjuster</text><rect x="40.0" y="164.0" width="250.0" height="72.0" rx="2" fill="#ecfeed" stroke="#00824d" stroke-width="1"/><text x="54.0" y="190.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#274247" text-anchor="start">Navs sykmeldingsregister</text><text x="54.0" y="212.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#274247" text-anchor="start">Alle legemeldte sykmeldinger</text><rect x="40.0" y="248.0" width="250.0" height="72.0" rx="2" fill="#ecfeed" stroke="#00824d" stroke-width="1"/><text x="54.0" y="274.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#274247" text-anchor="start">SSBs utvalgsundersøkelse</text><text x="54.0" y="296.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#274247" text-anchor="start">Egenmeldinger fra om lag</text><text x="54.0" y="315.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#274247" text-anchor="start">10 000 bedrifter</text><rect x="40.0" y="332.0" width="250.0" height="72.0" rx="2" fill="#ecfeed" stroke="#00824d" stroke-width="1"/><text x="54.0" y="358.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#274247" text-anchor="start">A-ordningen</text><text x="54.0" y="380.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#274247" text-anchor="start">Jobber, stillingsprosent og</text><text x="54.0" y="399.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#274247" text-anchor="start">avtalt arbeidstid</text><text x="330.0" y="178.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#274247" text-anchor="start">Hver arbeidsdag med fravær</text><text x="330.0" y="199.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#274247" text-anchor="start">teller, vektet med</text><text x="330.0" y="220.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#274247" text-anchor="start">stillingsprosent og</text><text x="330.0" y="241.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#274247" text-anchor="start">sykmeldingsgrad.</text><rect x="330.0" y="268.0" width="250.0" height="100.0" rx="2" fill="#ffffff" stroke="#c3dcdc" stroke-width="1"/><text x="344.0" y="294.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#274247" text-anchor="start">50 prosent sykmeldt i</text><text x="344.0" y="314.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#274247" text-anchor="start">80 prosent stilling:</text><text x="344.0" y="336.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#274247" text-anchor="start">0,5 × 0,8 = 0,4 dagsverk per dag</text><text x="344.0" y="356.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#5e787a" text-anchor="start">Eksempeltall, ikke statistikk</text><text x="330.0" y="414.0" font-family="Roboto Condensed, Arial Narrow, Arial, sans-serif" font-size="30" font-stretch="condensed" font-weight="700" fill="#274247" text-anchor="start">8,91 millioner</text><text x="330.0" y="438.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#274247" text-anchor="start">tapte dagsverk i 3. kvartal 2026,</text><text x="330.0" y="458.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#274247" text-anchor="start">ikke sesongjustert</text><text x="745.0" y="186.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#274247" text-anchor="middle">8,91 millioner tapte dagsverk</text><line x1="630.0" y1="198.0" x2="860.0" y2="198.0" stroke="#274247" stroke-width="1.5"/><text x="745.0" y="220.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#274247" text-anchor="middle">alle avtalte dagsverk</text><text x="745.0" y="266.0" font-family="Roboto Condensed, Arial Narrow, Arial, sans-serif" font-size="30" font-stretch="condensed" font-weight="700" fill="#274247" text-anchor="middle">= 5,7 prosent</text><text x="620.0" y="298.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#274247" text-anchor="start">Avtalte dagsverk er</text><text x="620.0" y="319.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#274247" text-anchor="start">arbeidsdagene folk har avtalt å</text><text x="620.0" y="340.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#274247" text-anchor="start">jobbe, justert for</text><text x="620.0" y="361.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#274247" text-anchor="start">stillingsprosent. Prosenten</text><text x="620.0" y="382.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#274247" text-anchor="start">måler dagsverk, ikke hvor mange</text><text x="620.0" y="403.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#274247" text-anchor="start">som er syke.</text><line x1="936.0" y1="302.0" x2="1060.0" y2="302.0" stroke="#d9dfe0" stroke-width="1"/><text x="930.0" y="307.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#5e787a" text-anchor="end">5</text><line x1="936.0" y1="266.0" x2="1060.0" y2="266.0" stroke="#d9dfe0" stroke-width="1"/><text x="930.0" y="271.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#5e787a" text-anchor="end">6</text><line x1="936.0" y1="230.0" x2="1060.0" y2="230.0" stroke="#d9dfe0" stroke-width="1"/><text x="930.0" y="235.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#5e787a" text-anchor="end">7</text><line x1="936.0" y1="194.0" x2="1060.0" y2="194.0" stroke="#d9dfe0" stroke-width="1"/><text x="930.0" y="199.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#5e787a" text-anchor="end">8</text><text x="930.0" y="180.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#5e787a" text-anchor="start">prosent</text><polyline points="946.0,215.6 965.0,251.6 984.0,280.4 1003.0,233.6 1022.0,219.2 1041.0,244.4 1060.0,276.8" fill="none" stroke="#b9c5c6" stroke-width="2" stroke-linejoin="round"/><polyline points="946.0,242.6 965.0,246.2 984.0,246.6 1003.0,246.6 1022.0,243.0 1041.0,241.9 1060.0,242.6" fill="none" stroke="#00824d" stroke-width="2.5" stroke-linejoin="round"/><circle cx="946.0" cy="215.6" r="3" fill="#b9c5c6" stroke="none" stroke-width="1"/><circle cx="965.0" cy="251.6" r="3" fill="#b9c5c6" stroke="none" stroke-width="1"/><circle cx="984.0" cy="280.4" r="3" fill="#b9c5c6" stroke="none" stroke-width="1"/><circle cx="1003.0" cy="233.6" r="3" fill="#b9c5c6" stroke="none" stroke-width="1"/><circle cx="1022.0" cy="219.2" r="3" fill="#b9c5c6" stroke="none" stroke-width="1"/><circle cx="1041.0" cy="244.4" r="3" fill="#b9c5c6" stroke="none" stroke-width="1"/><circle cx="1060.0" cy="276.8" r="3" fill="#b9c5c6" stroke="none" stroke-width="1"/><text x="1070.0" y="240.6" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#274247" text-anchor="start">6,65</text><text x="1070.0" y="257.6" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#5e787a" text-anchor="start">sesongjustert</text><text x="1070.0" y="280.8" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#274247" text-anchor="start">5,7</text><text x="1070.0" y="297.8" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#5e787a" text-anchor="start">ujustert</text><text x="946.0" y="322.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#5e787a" text-anchor="middle">2025</text><text x="1022.0" y="322.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#5e787a" text-anchor="middle">2026</text><text x="910.0" y="352.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#274247" text-anchor="start">Sommeren gir alltid lavere</text><text x="910.0" y="373.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#274247" text-anchor="start">fravær enn vinteren.</text><text x="910.0" y="394.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#274247" text-anchor="start">Sesongjusteringen fjerner det</text><text x="910.0" y="415.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#274247" text-anchor="start">faste mønsteret, så kvartalene</text><text x="910.0" y="436.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#274247" text-anchor="start">kan sammenlignes. Tallene</text><text x="910.0" y="457.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#274247" text-anchor="start">revideres ved hver publisering.</text><rect x="40.0" y="484.0" width="1120.0" height="64.0" rx="2" fill="#f3f5f5" stroke="#b9c5c6" stroke-width="1" stroke-dasharray="5,4"/><text x="56.0" y="510.0" font-family="Roboto, Arial, sans-serif" font-size="15" font-weight="700" fill="#5e787a" text-anchor="start">Ikke med i statistikken</text><text x="56.0" y="533.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#5e787a" text-anchor="start">Fravær for barns sykdom  ·  Foreldre- og omsorgspermisjon  ·  Selvstendig næringsdrivende  ·  Vernepliktige  ·  Diagnoser (publiseres av Nav)</text><text x="40.0" y="580.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#5e787a" text-anchor="start">Kilde: SSB, tabell 12439 og Om statistikken. Sist oppdatert: 26.11.2026.</text></svg>