<svg xmlns="http://www.w3.org/2000/svg" width="390" height="1683" viewBox="0 0 390 1683"><title>Slik lages tallene: sykefraværsprosenten i fire trinn</title><rect x="0" y="0" width="390" height="1683" fill="#ffffff"/><text x="20.0" y="40.0" font-family="Roboto Condensed, Arial Narrow, Arial, sans-serif" font-size="28" font-stretch="condensed" font-weight="700" fill="#274247" text-anchor="start">Slik lages tallene</text><text x="20.0" y="66.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#5e787a" text-anchor="start">Sykefraværsprosenten for 3. kvartal</text><text x="20.0" y="88.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#5e787a" text-anchor="start">2026, i fire trinn</text><line x1="20.0" y1="110.0" x2="370.0" y2="110.0" stroke="#c3dcdc" stroke-width="1"/><circle cx="35.0" cy="144.0" r="15" fill="#274247" stroke="none" stroke-width="1"/><text x="35.0" y="149.5" font-family="Roboto, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><text x="60.0" y="150.0" font-family="Roboto, Arial, sans-serif" font-size="18" font-weight="700" fill="#274247" text-anchor="start">Tre kilder</text><rect x="20.0" y="174.0" width="350.0" height="52.0" rx="2" fill="#ecfeed" stroke="#00824d" stroke-width="1"/><text x="34.0" y="198.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#274247" text-anchor="start">Navs sykmeldingsregister</text><text x="34.0" y="218.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#274247" text-anchor="start">Alle legemeldte sykmeldinger</text><rect x="20.0" y="236.0" width="350.0" height="71.0" rx="2" fill="#ecfeed" stroke="#00824d" stroke-width="1"/><text x="34.0" y="260.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#274247" text-anchor="start">SSBs utvalgsundersøkelse</text><text x="34.0" y="280.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#274247" text-anchor="start">Egenmeldinger fra om lag 10 000</text><text x="34.0" y="299.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#274247" text-anchor="start">bedrifter</text><rect x="20.0" y="317.0" width="350.0" height="71.0" rx="2" fill="#ecfeed" stroke="#00824d" stroke-width="1"/><text x="34.0" y="341.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#274247" text-anchor="start">A-ordningen</text><text x="34.0" y="361.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#274247" text-anchor="start">Jobber, stillingsprosent og avtalt</text><text x="34.0" y="380.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#274247" text-anchor="start">arbeidstid</text><line x1="35.0" y1="400.0" x2="35.0" y2="423.0" stroke="#274247" stroke-width="2"/><polygon points="35.0,432.0 29.6,423.0 40.4,423.0" fill="#274247"/><circle cx="35.0" cy="454.0" r="15" fill="#274247" stroke="none" stroke-width="1"/><text x="35.0" y="459.5" font-family="Roboto, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><text x="60.0" y="460.0" font-family="Roboto, Arial, sans-serif" font-size="18" font-weight="700" fill="#274247" text-anchor="start">Tell tapte dagsverk</text><text x="20.0" y="492.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#274247" text-anchor="start">Hver arbeidsdag med fravær teller, vektet</text><text x="20.0" y="513.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#274247" text-anchor="start">med stillingsprosent og sykmeldingsgrad.</text><rect x="20.0" y="538.0" width="350.0" height="100.0" rx="2" fill="#ffffff" stroke="#c3dcdc" stroke-width="1"/><text x="34.0" y="564.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#274247" text-anchor="start">50 prosent sykmeldt i</text><text x="34.0" y="584.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#274247" text-anchor="start">80 prosent stilling:</text><text x="34.0" y="606.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#274247" text-anchor="start">0,5 × 0,8 = 0,4 dagsverk per dag</text><text x="34.0" y="626.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#5e787a" text-anchor="start">Eksempeltall, ikke statistikk</text><text x="20.0" y="680.0" font-family="Roboto Condensed, Arial Narrow, Arial, sans-serif" font-size="28" font-stretch="condensed" font-weight="700" fill="#274247" text-anchor="start">8,91 millioner</text><text x="20.0" y="704.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#274247" text-anchor="start">tapte dagsverk i 3. kvartal 2026,</text><text x="20.0" y="724.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#274247" text-anchor="start">ikke sesongjustert</text><line x1="35.0" y1="752.0" x2="35.0" y2="775.0" stroke="#274247" stroke-width="2"/><polygon points="35.0,784.0 29.6,775.0 40.4,775.0" fill="#274247"/><circle cx="35.0" cy="806.0" r="15" fill="#274247" stroke="none" stroke-width="1"/><text x="35.0" y="811.5" font-family="Roboto, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><text x="60.0" y="812.0" font-family="Roboto, Arial, sans-serif" font-size="18" font-weight="700" fill="#274247" text-anchor="start">Del på avtalte dagsverk</text><text x="195.0" y="858.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#274247" text-anchor="middle">8,91 millioner tapte dagsverk</text><line x1="30.0" y1="870.0" x2="360.0" y2="870.0" stroke="#274247" stroke-width="1.5"/><text x="195.0" y="892.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#274247" text-anchor="middle">alle avtalte dagsverk</text><text x="195.0" y="938.0" font-family="Roboto Condensed, Arial Narrow, Arial, sans-serif" font-size="30" font-stretch="condensed" font-weight="700" fill="#274247" text-anchor="middle">= 5,7 prosent</text><text x="20.0" y="968.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#274247" text-anchor="start">Avtalte dagsverk er arbeidsdagene folk har</text><text x="20.0" y="989.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#274247" text-anchor="start">avtalt å jobbe, justert for</text><text x="20.0" y="1010.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#274247" text-anchor="start">stillingsprosent. Prosenten måler dagsverk,</text><text x="20.0" y="1031.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#274247" text-anchor="start">ikke hvor mange som er syke.</text><line x1="35.0" y1="1060.0" x2="35.0" y2="1083.0" stroke="#274247" stroke-width="2"/><polygon points="35.0,1092.0 29.6,1083.0 40.4,1083.0" fill="#274247"/><circle cx="35.0" cy="1114.0" r="15" fill="#274247" stroke="none" stroke-width="1"/><text x="35.0" y="1119.5" font-family="Roboto, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">4</text><text x="60.0" y="1120.0" font-family="Roboto, Arial, sans-serif" font-size="18" font-weight="700" fill="#274247" text-anchor="start">Sesongjuster</text><line x1="46.0" y1="1282.0" x2="270.0" y2="1282.0" stroke="#d9dfe0" stroke-width="1"/><text x="40.0" y="1287.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#5e787a" text-anchor="end">5</text><line x1="46.0" y1="1246.0" x2="270.0" y2="1246.0" stroke="#d9dfe0" stroke-width="1"/><text x="40.0" y="1251.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#5e787a" text-anchor="end">6</text><line x1="46.0" y1="1210.0" x2="270.0" y2="1210.0" stroke="#d9dfe0" stroke-width="1"/><text x="40.0" y="1215.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#5e787a" text-anchor="end">7</text><line x1="46.0" y1="1174.0" x2="270.0" y2="1174.0" stroke="#d9dfe0" stroke-width="1"/><text x="40.0" y="1179.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#5e787a" text-anchor="end">8</text><text x="40.0" y="1160.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#5e787a" text-anchor="start">prosent</text><polyline points="56.0,1195.6 91.7,1231.6 127.3,1260.4 163.0,1213.6 198.7,1199.2 234.3,1224.4 270.0,1256.8" fill="none" stroke="#b9c5c6" stroke-width="2" stroke-linejoin="round"/><polyline points="56.0,1222.6 91.7,1226.2 127.3,1226.6 163.0,1226.6 198.7,1223.0 234.3,1221.9 270.0,1222.6" fill="none" stroke="#00824d" stroke-width="2.5" stroke-linejoin="round"/><circle cx="56.0" cy="1195.6" r="3" fill="#b9c5c6" stroke="none" stroke-width="1"/><circle cx="91.7" cy="1231.6" r="3" fill="#b9c5c6" stroke="none" stroke-width="1"/><circle cx="127.3" cy="1260.4" r="3" fill="#b9c5c6" stroke="none" stroke-width="1"/><circle cx="163.0" cy="1213.6" r="3" fill="#b9c5c6" stroke="none" stroke-width="1"/><circle cx="198.7" cy="1199.2" r="3" fill="#b9c5c6" stroke="none" stroke-width="1"/><circle cx="234.3" cy="1224.4" r="3" fill="#b9c5c6" stroke="none" stroke-width="1"/><circle cx="270.0" cy="1256.8" r="3" fill="#b9c5c6" stroke="none" stroke-width="1"/><text x="280.0" y="1220.6" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#274247" text-anchor="start">6,65</text><text x="280.0" y="1237.6" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#5e787a" text-anchor="start">sesongjustert</text><text x="280.0" y="1260.8" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#274247" text-anchor="start">5,7</text><text x="280.0" y="1277.8" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#5e787a" text-anchor="start">ujustert</text><text x="56.0" y="1302.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#5e787a" text-anchor="middle">2025</text><text x="198.7" y="1302.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#5e787a" text-anchor="middle">2026</text><text x="20.0" y="1332.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#274247" text-anchor="start">Sommeren gir alltid lavere fravær enn</text><text x="20.0" y="1353.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#274247" text-anchor="start">vinteren. Sesongjusteringen fjerner det</text><text x="20.0" y="1374.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#274247" text-anchor="start">faste mønsteret, så kvartalene kan</text><text x="20.0" y="1395.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#274247" text-anchor="start">sammenlignes. Tallene revideres ved hver</text><text x="20.0" y="1416.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#274247" text-anchor="start">publisering.</text><rect x="20.0" y="1455.0" width="350.0" height="150.0" rx="2" fill="#f3f5f5" stroke="#b9c5c6" stroke-width="1" stroke-dasharray="5,4"/><text x="34.0" y="1481.0" font-family="Roboto, Arial, sans-serif" font-size="15" font-weight="700" fill="#5e787a" text-anchor="start">Ikke med i statistikken</text><text x="34.0" y="1505.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#5e787a" text-anchor="start">– Fravær for barns sykdom</text><text x="34.0" y="1527.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#5e787a" text-anchor="start">– Foreldre- og omsorgspermisjon</text><text x="34.0" y="1549.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#5e787a" text-anchor="start">– Selvstendig næringsdrivende</text><text x="34.0" y="1571.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#5e787a" text-anchor="start">– Vernepliktige</text><text x="34.0" y="1593.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#5e787a" text-anchor="start">– Diagnoser (publiseres av Nav)</text><text x="20.0" y="1635.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#5e787a" text-anchor="start">Kilde: SSB, tabell 12439 og Om statistikken.</text><text x="20.0" y="1654.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#5e787a" text-anchor="start">Sist oppdatert: 26.11.2026.</text></svg>