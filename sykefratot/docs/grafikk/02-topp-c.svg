<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330"><title>Egenmeldinger er to av tre fravær, men 14 prosent av de tapte dagsverkene</title><rect x="0" y="0" width="1200" height="330" fill="#ffffff"/><text x="40.0" y="44.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#5e787a" text-anchor="start">Sykefravær · 3. kvartal 2026</text><text x="36.0" y="116.0" font-family="Roboto Condensed, Arial Narrow, Arial, sans-serif" font-size="64" font-stretch="condensed" font-weight="700" fill="#274247" text-anchor="start">2 av 3</text><text x="40.0" y="154.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="21" font-weight="600" fill="#274247" text-anchor="start">fravær er egenmeldinger. De er likevel</text><text x="40.0" y="182.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="21" font-weight="600" fill="#274247" text-anchor="start">bare 14 prosent av de tapte dagsverkene.</text><text x="40.0" y="218.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#5e787a" text-anchor="start">Sykmeldinger på 32 dager eller mer er 12 prosent av</text><text x="40.0" y="239.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#5e787a" text-anchor="start">fraværene og 63 prosent av dagsverkene.</text><text x="40.0" y="260.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#5e787a" text-anchor="start">Ikke sesongjustert. Varigheten er regnet innenfor</text><text x="40.0" y="281.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#5e787a" text-anchor="start">kvartalet.</text><text x="40.0" y="314.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#5e787a" text-anchor="start">Kilde: SSB, tabell 12946. Sist oppdatert: 26.11.2026.</text><rect x="620.0" y="34.0" width="14.0" height="14.0" rx="0" fill="#91cd9a" stroke="none" stroke-width="1"/><text x="640.0" y="46.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#274247" text-anchor="start">Egenmeldt</text><rect x="860.0" y="34.0" width="14.0" height="14.0" rx="0" fill="#58a772" stroke="none" stroke-width="1"/><text x="880.0" y="46.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#274247" text-anchor="start">Legemeldt 1–16 dager</text><rect x="620.0" y="56.0" width="14.0" height="14.0" rx="0" fill="#00824d" stroke="none" stroke-width="1"/><text x="640.0" y="68.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#274247" text-anchor="start">Legemeldt 17–31 dager</text><rect x="860.0" y="56.0" width="14.0" height="14.0" rx="0" fill="#075745" stroke="none" stroke-width="1"/><text x="880.0" y="68.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#274247" text-anchor="start">Legemeldt 32 dager eller mer</text><text x="620.0" y="100.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#274247" text-anchor="start">Fraværstilfeller (1,37 millioner)</text><rect x="620.0" y="112.0" width="338.8" height="40.0" rx="0" fill="#91cd9a" stroke="none" stroke-width="1"/><text x="789.4" y="138.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#274247" text-anchor="middle">63</text><rect x="958.8" y="112.0" width="110.8" height="40.0" rx="0" fill="#58a772" stroke="none" stroke-width="1"/><text x="1014.2" y="138.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">20</text><rect x="1069.6" y="112.0" width="28.0" height="40.0" rx="0" fill="#00824d" stroke="none" stroke-width="1"/><text x="1083.6" y="172.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#274247" text-anchor="middle">5</text><rect x="1097.6" y="112.0" width="62.4" height="40.0" rx="0" fill="#075745" stroke="none" stroke-width="1"/><text x="1128.8" y="138.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">12</text><text x="620.0" y="196.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#274247" text-anchor="start">Tapte dagsverk (8,91 millioner)</text><rect x="620.0" y="208.0" width="74.2" height="40.0" rx="0" fill="#91cd9a" stroke="none" stroke-width="1"/><text x="657.1" y="234.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#274247" text-anchor="middle">14</text><rect x="694.2" y="208.0" width="71.4" height="40.0" rx="0" fill="#58a772" stroke="none" stroke-width="1"/><text x="729.9" y="234.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">13</text><rect x="765.6" y="208.0" width="55.8" height="40.0" rx="0" fill="#00824d" stroke="none" stroke-width="1"/><text x="793.5" y="234.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">10</text><rect x="821.4" y="208.0" width="338.6" height="40.0" rx="0" fill="#075745" stroke="none" stroke-width="1"/><text x="990.7" y="234.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">63</text><text x="620.0" y="290.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#5e787a" text-anchor="start">Prosent av alle i 3. kvartal 2026. Andelene er regnet fra publiserte antall.</text></svg>