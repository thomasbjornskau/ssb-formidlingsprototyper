<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400"><rect x="0.0" y="0.0" width="1200.0" height="400.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0"/><rect x="20.0" y="20.0" width="270.0" height="270.0" rx="2" fill="#e2eef7" stroke="none" stroke-width="0"/><rect x="20.0" y="20.0" width="270.0" height="5.0" rx="0" fill="#0072B2" stroke="none" stroke-width="0"/><circle cx="54.0" cy="66.0" r="16.0" fill="#0072B2" stroke="none" stroke-width="1.5"/><text x="54.0" y="72.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="80.0" y="72.0" font-family="Roboto, Arial, sans-serif" font-size="18" font-weight="700" fill="#274247" text-anchor="start">Kartlegge naturen</text><text x="40.0" y="116.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#274247" text-anchor="start">Kart fra NIBIO, Kartverket</text><text x="40.0" y="137.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#274247" text-anchor="start">og SSB settes sammen til</text><text x="40.0" y="158.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#274247" text-anchor="start">ett grunnkart. Det gir</text><text x="40.0" y="179.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#274247" text-anchor="start">arealet av hver naturtype.</text><text x="40.0" y="272.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#0072B2" text-anchor="start">UTBREDELSE</text><polyline points="294.0,155.0 326.0,155.0" fill="none" stroke="#5e787a" stroke-width="2"/><polygon points="326.0,155.0 317.2,159.7 317.2,150.3" fill="#5e787a"/><rect x="330.0" y="20.0" width="270.0" height="270.0" rx="2" fill="#dff3ec" stroke="none" stroke-width="0"/><rect x="330.0" y="20.0" width="270.0" height="5.0" rx="0" fill="#009E73" stroke="none" stroke-width="0"/><circle cx="364.0" cy="66.0" r="16.0" fill="#009E73" stroke="none" stroke-width="1.5"/><text x="364.0" y="72.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="390.0" y="72.0" font-family="Roboto, Arial, sans-serif" font-size="18" font-weight="700" fill="#274247" text-anchor="start">Måle tilstanden</text><text x="350.0" y="116.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#274247" text-anchor="start">Målinger som død ved og</text><text x="350.0" y="137.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#274247" text-anchor="start">vannkvalitet sammenlignes</text><text x="350.0" y="158.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#274247" text-anchor="start">med intakt natur og settes</text><text x="350.0" y="179.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#274247" text-anchor="start">på en skala fra 0 til 1.</text><text x="350.0" y="272.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#009E73" text-anchor="start">TILSTAND</text><polyline points="604.0,155.0 636.0,155.0" fill="none" stroke="#5e787a" stroke-width="2"/><polygon points="636.0,155.0 627.2,159.7 627.2,150.3" fill="#5e787a"/><rect x="640.0" y="20.0" width="270.0" height="270.0" rx="2" fill="#fcf0d6" stroke="none" stroke-width="0"/><rect x="640.0" y="20.0" width="270.0" height="5.0" rx="0" fill="#E69F00" stroke="none" stroke-width="0"/><circle cx="674.0" cy="66.0" r="16.0" fill="#E69F00" stroke="none" stroke-width="1.5"/><text x="674.0" y="72.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#274247" text-anchor="middle">3</text><text x="700.0" y="72.0" font-family="Roboto, Arial, sans-serif" font-size="18" font-weight="700" fill="#274247" text-anchor="start">Telle hva naturen</text><text x="700.0" y="94.0" font-family="Roboto, Arial, sans-serif" font-size="18" font-weight="700" fill="#274247" text-anchor="start">gir</text><text x="660.0" y="138.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#274247" text-anchor="start">Ni tjenester, som tømmer,</text><text x="660.0" y="159.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#274247" text-anchor="start">karbon og turer, måles hver</text><text x="660.0" y="180.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#274247" text-anchor="start">i sin enhet og fordeles på</text><text x="660.0" y="201.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#274247" text-anchor="start">naturtype og bruker.</text><text x="660.0" y="272.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#274247" text-anchor="start">ØKOSYSTEMTJENESTER</text><polyline points="914.0,155.0 946.0,155.0" fill="none" stroke="#5e787a" stroke-width="2"/><polygon points="946.0,155.0 937.2,159.7 937.2,150.3" fill="#5e787a"/><rect x="950.0" y="20.0" width="270.0" height="270.0" rx="2" fill="#f0f8f9" stroke="none" stroke-width="0"/><rect x="950.0" y="20.0" width="270.0" height="5.0" rx="0" fill="#274247" stroke="none" stroke-width="0"/><circle cx="984.0" cy="66.0" r="16.0" fill="#274247" stroke="none" stroke-width="1.5"/><text x="984.0" y="72.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="1010.0" y="72.0" font-family="Roboto, Arial, sans-serif" font-size="18" font-weight="700" fill="#274247" text-anchor="start">Sette regnskapene</text><text x="1010.0" y="94.0" font-family="Roboto, Arial, sans-serif" font-size="18" font-weight="700" fill="#274247" text-anchor="start">side om side</text><text x="970.0" y="138.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#274247" text-anchor="start">De tre delene vises per</text><text x="970.0" y="159.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#274247" text-anchor="start">naturtype, men legges ikke</text><text x="970.0" y="180.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#274247" text-anchor="start">sammen. De er målt på ulike</text><text x="970.0" y="201.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#274247" text-anchor="start">måter og til dels i ulike</text><text x="970.0" y="222.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#274247" text-anchor="start">år.</text><text x="970.0" y="272.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#274247" text-anchor="start">NATURREGNSKAPET</text><rect x="20.0" y="316.0" width="1160.0" height="64.0" rx="2" fill="#ffffff" stroke="#b9c5c6" stroke-width="1" stroke-dasharray="6 4"/><text x="44.0" y="354.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="16" font-weight="400" fill="#5e787a" text-anchor="start">Ikke med i 2026: naturens verdi i kroner, endringer utover utbygging, og det meste av havet.</text></svg>