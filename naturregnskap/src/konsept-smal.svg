<svg xmlns="http://www.w3.org/2000/svg" width="390" height="902" viewBox="0 0 390 902"><rect x="0.0" y="0.0" width="390.0" height="902.0" rx="0" fill="#ffffff" stroke="none" stroke-width="0"/><rect x="10.0" y="16.0" width="370.0" height="165.0" rx="2" fill="#e2eef7" stroke="none" stroke-width="0"/><rect x="10.0" y="16.0" width="5.0" height="165.0" rx="0" fill="#0072B2" stroke="none" stroke-width="0"/><circle cx="42.0" cy="46.0" r="15.0" fill="#0072B2" stroke="none" stroke-width="1.5"/><text x="42.0" y="52.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">1</text><text x="68.0" y="52.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#274247" text-anchor="start">Kartlegge naturen</text><text x="68.0" y="78.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#274247" text-anchor="start">Kart fra NIBIO, Kartverket og SSB</text><text x="68.0" y="99.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#274247" text-anchor="start">settes sammen til ett grunnkart. Det</text><text x="68.0" y="120.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#274247" text-anchor="start">gir arealet av hver naturtype.</text><text x="68.0" y="167.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#0072B2" text-anchor="start">UTBREDELSE</text><polyline points="195.0,183.0 195.0,203.0" fill="none" stroke="#5e787a" stroke-width="2"/><polygon points="195.0,203.0 190.8,195.1 199.2,195.1" fill="#5e787a"/><rect x="10.0" y="207.0" width="370.0" height="165.0" rx="2" fill="#dff3ec" stroke="none" stroke-width="0"/><rect x="10.0" y="207.0" width="5.0" height="165.0" rx="0" fill="#009E73" stroke="none" stroke-width="0"/><circle cx="42.0" cy="237.0" r="15.0" fill="#009E73" stroke="none" stroke-width="1.5"/><text x="42.0" y="243.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">2</text><text x="68.0" y="243.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#274247" text-anchor="start">Måle tilstanden</text><text x="68.0" y="269.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#274247" text-anchor="start">Målinger som død ved og vannkvalitet</text><text x="68.0" y="290.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#274247" text-anchor="start">sammenlignes med intakt natur og</text><text x="68.0" y="311.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#274247" text-anchor="start">settes på en skala fra 0 til 1.</text><text x="68.0" y="358.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#009E73" text-anchor="start">TILSTAND</text><polyline points="195.0,374.0 195.0,394.0" fill="none" stroke="#5e787a" stroke-width="2"/><polygon points="195.0,394.0 190.8,386.1 199.2,386.1" fill="#5e787a"/><rect x="10.0" y="398.0" width="370.0" height="165.0" rx="2" fill="#fcf0d6" stroke="none" stroke-width="0"/><rect x="10.0" y="398.0" width="5.0" height="165.0" rx="0" fill="#E69F00" stroke="none" stroke-width="0"/><circle cx="42.0" cy="428.0" r="15.0" fill="#E69F00" stroke="none" stroke-width="1.5"/><text x="42.0" y="434.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#274247" text-anchor="middle">3</text><text x="68.0" y="434.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#274247" text-anchor="start">Telle hva naturen gir</text><text x="68.0" y="460.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#274247" text-anchor="start">Ni tjenester, som tømmer, karbon og</text><text x="68.0" y="481.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#274247" text-anchor="start">turer, måles hver i sin enhet og</text><text x="68.0" y="502.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#274247" text-anchor="start">fordeles på naturtype og bruker.</text><text x="68.0" y="549.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#274247" text-anchor="start">ØKOSYSTEMTJENESTER</text><polyline points="195.0,565.0 195.0,585.0" fill="none" stroke="#5e787a" stroke-width="2"/><polygon points="195.0,585.0 190.8,577.1 199.2,577.1" fill="#5e787a"/><rect x="10.0" y="589.0" width="370.0" height="186.0" rx="2" fill="#f0f8f9" stroke="none" stroke-width="0"/><rect x="10.0" y="589.0" width="5.0" height="186.0" rx="0" fill="#274247" stroke="none" stroke-width="0"/><circle cx="42.0" cy="619.0" r="15.0" fill="#274247" stroke="none" stroke-width="1.5"/><text x="42.0" y="625.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">4</text><text x="68.0" y="625.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="17" font-weight="700" fill="#274247" text-anchor="start">Sette regnskapene side om side</text><text x="68.0" y="651.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#274247" text-anchor="start">De tre delene vises per naturtype,</text><text x="68.0" y="672.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#274247" text-anchor="start">men legges ikke sammen. De er målt</text><text x="68.0" y="693.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#274247" text-anchor="start">på ulike måter og til dels i ulike</text><text x="68.0" y="714.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#274247" text-anchor="start">år.</text><text x="68.0" y="761.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#274247" text-anchor="start">NATURREGNSKAPET</text><rect x="10.0" y="789.0" width="370.0" height="97.0" rx="2" fill="#ffffff" stroke="#b9c5c6" stroke-width="1" stroke-dasharray="6 4"/><text x="30.0" y="819.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#5e787a" text-anchor="start">Ikke med i 2026: naturens verdi i</text><text x="30.0" y="840.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#5e787a" text-anchor="start">kroner, endringer utover utbygging, og</text><text x="30.0" y="861.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#5e787a" text-anchor="start">det meste av havet.</text></svg>