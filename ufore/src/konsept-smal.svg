<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 1426" width="390" height="1426" role="img"><title>Slik lages tallene</title><desc>Fire trinn fra vedtak hos NAV til andel uføretrygdede i befolkningen 18–67 år.</desc><rect x="0" y="0" width="390" height="1426" fill="#ffffff"/><rect x="24.0" y="24.0" width="342.0" height="140.0" rx="2" fill="#f0f8f9" stroke="#c3dcdc" stroke-width="1"/><rect x="24.0" y="24.0" width="342.0" height="5.0" rx="0" fill="#00824d"/><circle cx="50.0" cy="60.0" r="14" fill="#00824d"/><text x="50.0" y="65.0" font-family="Roboto, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><text x="72.0" y="66.0" font-family="Roboto, Arial, sans-serif" font-size="18" font-weight="700" fill="#274247" text-anchor="start">Vedtak hos NAV</text><text x="42.0" y="100.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#274247" text-anchor="start">NAV registrerer hvem som har vedtak om</text><text x="42.0" y="121.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#274247" text-anchor="start">uføretrygd, måned for måned. SSB får</text><text x="42.0" y="142.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#274247" text-anchor="start">opplysningene per person.</text><line x1="195.0" y1="170.0" x2="195.0" y2="185.0" stroke="#274247" stroke-width="2"/><polygon points="195.0,194.0 189.6,185.0 200.4,185.0" fill="#274247"/><rect x="24.0" y="200.0" width="342.0" height="196.0" rx="2" fill="#f0f8f9" stroke="#c3dcdc" stroke-width="1"/><rect x="24.0" y="200.0" width="342.0" height="5.0" rx="0" fill="#00824d"/><circle cx="50.0" cy="236.0" r="14" fill="#00824d"/><text x="50.0" y="241.0" font-family="Roboto, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><text x="72.0" y="242.0" font-family="Roboto, Arial, sans-serif" font-size="18" font-weight="700" fill="#274247" text-anchor="start">Ett år samles</text><text x="42.0" y="276.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#274247" text-anchor="start">Alle med vedtak minst én måned i året</text><text x="42.0" y="297.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#274247" text-anchor="start">telles, også de som ikke fikk utbetalt</text><text x="42.0" y="318.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#274247" text-anchor="start">fordi de tjente for mye.</text><text x="42.0" y="354.0" font-family="Roboto Condensed, Arial Narrow, Arial, sans-serif" font-size="30" font-weight="700" fill="#00824d" text-anchor="start" font-variant-numeric="tabular-nums">401 262</text><text x="42.0" y="380.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#5e787a" text-anchor="start">hadde vedtak i 2025</text><line x1="195.0" y1="402.0" x2="195.0" y2="417.0" stroke="#274247" stroke-width="2"/><polygon points="195.0,426.0 189.6,417.0 200.4,417.0" fill="#274247"/><rect x="24.0" y="432.0" width="342.0" height="196.0" rx="2" fill="#f0f8f9" stroke="#c3dcdc" stroke-width="1"/><rect x="24.0" y="432.0" width="342.0" height="5.0" rx="0" fill="#00824d"/><circle cx="50.0" cy="468.0" r="14" fill="#00824d"/><text x="50.0" y="473.0" font-family="Roboto, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><text x="72.0" y="474.0" font-family="Roboto, Arial, sans-serif" font-size="18" font-weight="700" fill="#274247" text-anchor="start">Bare bosatte</text><text x="42.0" y="508.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#274247" text-anchor="start">De som døde eller flyttet ut i løpet</text><text x="42.0" y="529.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#274247" text-anchor="start">av året, trekkes fra: 12 239 personer.</text><text x="42.0" y="586.0" font-family="Roboto Condensed, Arial Narrow, Arial, sans-serif" font-size="30" font-weight="700" fill="#00824d" text-anchor="start" font-variant-numeric="tabular-nums">389 023</text><text x="42.0" y="612.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#5e787a" text-anchor="start">uføretrygdede 18–67 år</text><line x1="195.0" y1="634.0" x2="195.0" y2="649.0" stroke="#274247" stroke-width="2"/><polygon points="195.0,658.0 189.6,649.0 200.4,649.0" fill="#274247"/><rect x="24.0" y="664.0" width="342.0" height="196.0" rx="2" fill="#f0f8f9" stroke="#c3dcdc" stroke-width="1"/><rect x="24.0" y="664.0" width="342.0" height="5.0" rx="0" fill="#00824d"/><circle cx="50.0" cy="700.0" r="14" fill="#00824d"/><text x="50.0" y="705.0" font-family="Roboto, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">4</text><text x="72.0" y="706.0" font-family="Roboto, Arial, sans-serif" font-size="18" font-weight="700" fill="#274247" text-anchor="start">Andel av befolkningen</text><text x="42.0" y="740.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#274247" text-anchor="start">Antallet deles på alle bosatte 18–67</text><text x="42.0" y="761.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#274247" text-anchor="start">år ved årsslutt: 3 626 571 personer.</text><text x="42.0" y="818.0" font-family="Roboto Condensed, Arial Narrow, Arial, sans-serif" font-size="30" font-weight="700" fill="#00824d" text-anchor="start" font-variant-numeric="tabular-nums">10,7 prosent</text><text x="42.0" y="844.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#5e787a" text-anchor="start">av befolkningen 18–67 år</text><rect x="24.0" y="880.0" width="342.0" height="132.0" rx="2" fill="#ecfeed" stroke="#b6e8b8" stroke-width="1"/><text x="40.0" y="908.0" font-family="Roboto, Arial, sans-serif" font-size="16" font-weight="700" fill="#274247" text-anchor="start">Kobles med</text><text x="40.0" y="936.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#274247" text-anchor="start">Alder og bosted: folkeregisteret, 31.12</text><text x="40.0" y="960.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#274247" text-anchor="start">Utdanning: NUDB, 1.10</text><text x="40.0" y="984.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#274247" text-anchor="start">Arbeid: a-ordningen, hver måned</text><rect x="24.0" y="1032.0" width="342.0" height="176.0" rx="2" fill="#ffffff" stroke="#274247" stroke-width="1"/><text x="40.0" y="1060.0" font-family="Roboto, Arial, sans-serif" font-size="16" font-weight="700" fill="#274247" text-anchor="start">Hvorfor NAV har et lavere tall</text><text x="40.0" y="1086.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#274247" text-anchor="start">NAV teller bare dem som får utbetalt ved</text><text x="40.0" y="1106.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#274247" text-anchor="start">utgangen av perioden: 374 900 ved</text><text x="40.0" y="1126.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#274247" text-anchor="start">utgangen av 2025.</text><text x="40.0" y="1156.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#5e787a" text-anchor="start">Begge tallene er riktige. De svarer på ulike</text><text x="40.0" y="1176.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#5e787a" text-anchor="start">spørsmål.</text><rect x="24.0" y="1228.0" width="342.0" height="142.0" rx="2" fill="#f3f5f5" stroke="#b9c5c6" stroke-width="1" stroke-dasharray="6 4"/><text x="40.0" y="1256.0" font-family="Roboto, Arial, sans-serif" font-size="16" font-weight="700" fill="#5e787a" text-anchor="start">Ikke med i statistikken</text><text x="40.0" y="1282.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#5e787a" text-anchor="start">– Diagnose eller årsak til uførheten</text><text x="40.0" y="1305.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#5e787a" text-anchor="start">– Hvor mange timer uføre jobber</text><text x="40.0" y="1328.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#5e787a" text-anchor="start">– Private uføreforsikringer uten vedtak i</text><text x="40.0" y="1347.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#5e787a" text-anchor="start">folketrygden</text><text x="24.0" y="1396.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#5e787a" text-anchor="start">Kilde: SSB, tabell 11824, 11695 og 07459. Om</text><text x="24.0" y="1411.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#5e787a" text-anchor="start">statistikken, 15.09.2026.</text></svg>