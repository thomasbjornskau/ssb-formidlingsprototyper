<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img"><title>Slik lages tallene</title><desc>Fire trinn fra vedtak hos NAV til andel uføretrygdede i befolkningen 18–67 år.</desc><rect x="0" y="0" width="1200" height="560" fill="#ffffff"/><rect x="24.0" y="24.0" width="258.0" height="268.0" rx="2" fill="#f0f8f9" stroke="#c3dcdc" stroke-width="1"/><rect x="24.0" y="24.0" width="258.0" height="5.0" rx="0" fill="#00824d"/><circle cx="50.0" cy="60.0" r="14" fill="#00824d"/><text x="50.0" y="65.0" font-family="Roboto, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><text x="72.0" y="66.0" font-family="Roboto, Arial, sans-serif" font-size="18" font-weight="700" fill="#274247" text-anchor="start">Vedtak hos NAV</text><text x="42.0" y="100.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#274247" text-anchor="start">NAV registrerer hvem som har</text><text x="42.0" y="121.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#274247" text-anchor="start">vedtak om uføretrygd, måned</text><text x="42.0" y="142.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#274247" text-anchor="start">for måned. SSB får</text><text x="42.0" y="163.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#274247" text-anchor="start">opplysningene per person.</text><line x1="290.0" y1="158.0" x2="305.0" y2="158.0" stroke="#274247" stroke-width="2"/><polygon points="314.0,158.0 305.0,152.6 305.0,163.4" fill="#274247"/><rect x="322.0" y="24.0" width="258.0" height="268.0" rx="2" fill="#f0f8f9" stroke="#c3dcdc" stroke-width="1"/><rect x="322.0" y="24.0" width="258.0" height="5.0" rx="0" fill="#00824d"/><circle cx="348.0" cy="60.0" r="14" fill="#00824d"/><text x="348.0" y="65.0" font-family="Roboto, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><text x="370.0" y="66.0" font-family="Roboto, Arial, sans-serif" font-size="18" font-weight="700" fill="#274247" text-anchor="start">Ett år samles</text><text x="340.0" y="100.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#274247" text-anchor="start">Alle med vedtak minst én</text><text x="340.0" y="121.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#274247" text-anchor="start">måned i året telles, også de</text><text x="340.0" y="142.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#274247" text-anchor="start">som ikke fikk utbetalt fordi</text><text x="340.0" y="163.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#274247" text-anchor="start">de tjente for mye.</text><text x="340.0" y="250.0" font-family="Roboto Condensed, Arial Narrow, Arial, sans-serif" font-size="34" font-weight="700" fill="#00824d" text-anchor="start" font-variant-numeric="tabular-nums">401 262</text><text x="340.0" y="276.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#5e787a" text-anchor="start">hadde vedtak i 2025</text><line x1="588.0" y1="158.0" x2="603.0" y2="158.0" stroke="#274247" stroke-width="2"/><polygon points="612.0,158.0 603.0,152.6 603.0,163.4" fill="#274247"/><rect x="620.0" y="24.0" width="258.0" height="268.0" rx="2" fill="#f0f8f9" stroke="#c3dcdc" stroke-width="1"/><rect x="620.0" y="24.0" width="258.0" height="5.0" rx="0" fill="#00824d"/><circle cx="646.0" cy="60.0" r="14" fill="#00824d"/><text x="646.0" y="65.0" font-family="Roboto, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><text x="668.0" y="66.0" font-family="Roboto, Arial, sans-serif" font-size="18" font-weight="700" fill="#274247" text-anchor="start">Bare bosatte</text><text x="638.0" y="100.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#274247" text-anchor="start">De som døde eller flyttet ut</text><text x="638.0" y="121.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#274247" text-anchor="start">i løpet av året, trekkes fra:</text><text x="638.0" y="142.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#274247" text-anchor="start">12 239 personer.</text><text x="638.0" y="250.0" font-family="Roboto Condensed, Arial Narrow, Arial, sans-serif" font-size="34" font-weight="700" fill="#00824d" text-anchor="start" font-variant-numeric="tabular-nums">389 023</text><text x="638.0" y="276.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#5e787a" text-anchor="start">uføretrygdede 18–67 år</text><line x1="886.0" y1="158.0" x2="901.0" y2="158.0" stroke="#274247" stroke-width="2"/><polygon points="910.0,158.0 901.0,152.6 901.0,163.4" fill="#274247"/><rect x="918.0" y="24.0" width="258.0" height="268.0" rx="2" fill="#f0f8f9" stroke="#c3dcdc" stroke-width="1"/><rect x="918.0" y="24.0" width="258.0" height="5.0" rx="0" fill="#00824d"/><circle cx="944.0" cy="60.0" r="14" fill="#00824d"/><text x="944.0" y="65.0" font-family="Roboto, Arial, sans-serif" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">4</text><text x="966.0" y="66.0" font-family="Roboto, Arial, sans-serif" font-size="18" font-weight="700" fill="#274247" text-anchor="start">Andel av befolkningen</text><text x="936.0" y="100.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#274247" text-anchor="start">Antallet deles på alle</text><text x="936.0" y="121.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#274247" text-anchor="start">bosatte 18–67 år ved</text><text x="936.0" y="142.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#274247" text-anchor="start">årsslutt: 3 626 571 personer.</text><text x="936.0" y="250.0" font-family="Roboto Condensed, Arial Narrow, Arial, sans-serif" font-size="34" font-weight="700" fill="#00824d" text-anchor="start" font-variant-numeric="tabular-nums">10,7 prosent</text><text x="936.0" y="276.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#5e787a" text-anchor="start">av befolkningen 18–67 år</text><rect x="24.0" y="320.0" width="1152.0" height="74.0" rx="2" fill="#ecfeed" stroke="#b6e8b8" stroke-width="1"/><text x="42.0" y="350.0" font-family="Roboto, Arial, sans-serif" font-size="16" font-weight="700" fill="#274247" text-anchor="start">Kobles med</text><text x="42.0" y="374.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#5e787a" text-anchor="start">for å fordele tallene</text><text x="250.0" y="350.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#274247" text-anchor="start">Alder og bosted</text><text x="250.0" y="374.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#5e787a" text-anchor="start">folkeregisteret, 31.12</text><text x="560.0" y="350.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#274247" text-anchor="start">Utdanning</text><text x="560.0" y="374.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#5e787a" text-anchor="start">NUDB, 1.10</text><text x="870.0" y="350.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#274247" text-anchor="start">Arbeid</text><text x="870.0" y="374.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#5e787a" text-anchor="start">a-ordningen, hver måned</text><rect x="24.0" y="416.0" width="560.0" height="120.0" rx="2" fill="#ffffff" stroke="#274247" stroke-width="1"/><text x="42.0" y="448.0" font-family="Roboto, Arial, sans-serif" font-size="17" font-weight="700" fill="#274247" text-anchor="start">Hvorfor NAV har et lavere tall</text><text x="42.0" y="476.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#274247" text-anchor="start">NAV teller bare dem som får utbetalt ved utgangen av perioden:</text><text x="42.0" y="497.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#274247" text-anchor="start">374 900 ved utgangen av 2025.</text><text x="42.0" y="524.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="400" fill="#5e787a" text-anchor="start">Begge tallene er riktige. De svarer på ulike spørsmål.</text><rect x="616.0" y="416.0" width="560.0" height="120.0" rx="2" fill="#f3f5f5" stroke="#b9c5c6" stroke-width="1" stroke-dasharray="6 4"/><text x="634.0" y="448.0" font-family="Roboto, Arial, sans-serif" font-size="17" font-weight="700" fill="#5e787a" text-anchor="start">Ikke med i statistikken</text><text x="634.0" y="476.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#5e787a" text-anchor="start">– Diagnose eller årsak til uførheten</text><text x="634.0" y="498.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#5e787a" text-anchor="start">– Hvor mange timer uføre jobber</text><text x="634.0" y="520.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#5e787a" text-anchor="start">– Private uføreforsikringer uten vedtak i folketrygden</text><text x="1176.0" y="556.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#5e787a" text-anchor="end">Kilde: SSB, tabell 11824, 11695 og 07459. Om statistikken, 15.09.2026.</text></svg>