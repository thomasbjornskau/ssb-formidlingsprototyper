<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img"><title>Toppgrafikk C</title><desc>Tre av fire uføretrygdede hadde ikke lønnsarbeid noen av månedene de var uføre, både i 2015 og 2025.</desc><rect x="0" y="0" width="1200" height="330" fill="#ffffff"/><text x="40.0" y="46.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#5e787a" text-anchor="start">UFØRETRYGDEDE OG ARBEID · 2025</text><text x="40.0" y="112.0" font-family="Roboto Condensed, Arial Narrow, Arial, sans-serif" font-size="60" font-weight="700" fill="#00824d" text-anchor="start" font-variant-numeric="tabular-nums">3 av 4</text><text x="40.0" y="150.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="19" font-weight="600" fill="#274246" text-anchor="start">uføretrygdede hadde ikke lønnsarbeid noen av</text><text x="40.0" y="176.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="19" font-weight="600" fill="#274246" text-anchor="start">månedene de var uføre i 2025.</text><text x="40.0" y="210.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#274246" text-anchor="start">1 av 7 hadde lønnsarbeid i alle månedene, men målet teller</text><text x="40.0" y="231.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#274246" text-anchor="start">måneder, ikke timer.</text><text x="40.0" y="258.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#274246" text-anchor="start">85 prosent har 100 prosent uføregrad.</text><text x="1160.0" y="318.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#5e787a" text-anchor="end">Kilde: SSB, tabell 11850 og 11720. Sist oppdatert: 02.09.2026.</text><text x="680.0" y="44.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#5e787a" text-anchor="start">Andel av månedene som uføre med lønnsarbeid. Prosent</text><text x="668.0" y="122.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#274247" text-anchor="end" font-variant-numeric="tabular-nums">2015</text><rect x="680.0" y="92.0" width="352.4" height="46.0" rx="0" fill="#cff1d0" stroke="#91cd9a" stroke-width="1"/><text x="857.2" y="122.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#274246" text-anchor="middle" font-variant-numeric="tabular-nums">75,4</text><text x="856.2" y="82.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#274247" text-anchor="middle">Ingen</text><rect x="1034.4" y="92.0" width="25.7" height="46.0" rx="0" fill="#91cd9a"/><text x="1047.2" y="156.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#274247" text-anchor="middle" font-variant-numeric="tabular-nums">5,9</text><text x="1047.2" y="82.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#274247" text-anchor="middle">Lav</text><rect x="1062.1" y="92.0" width="20.1" height="46.0" rx="0" fill="#58a772"/><text x="1072.2" y="156.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#274247" text-anchor="middle" font-variant-numeric="tabular-nums">4,7</text><text x="1072.2" y="82.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#274247" text-anchor="middle">Høy</text><rect x="1084.2" y="92.0" width="63.8" height="46.0" rx="0" fill="#00824d"/><text x="1117.1" y="122.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle" font-variant-numeric="tabular-nums">14,0</text><text x="1116.1" y="82.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#274247" text-anchor="middle">Full</text><text x="668.0" y="218.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#274247" text-anchor="end" font-variant-numeric="tabular-nums">2025</text><rect x="680.0" y="188.0" width="353.8" height="46.0" rx="0" fill="#cff1d0" stroke="#91cd9a" stroke-width="1"/><text x="857.9" y="218.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#274246" text-anchor="middle" font-variant-numeric="tabular-nums">75,7</text><rect x="1035.8" y="188.0" width="26.2" height="46.0" rx="0" fill="#91cd9a"/><text x="1048.9" y="252.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#274247" text-anchor="middle" font-variant-numeric="tabular-nums">6,0</text><rect x="1064.0" y="188.0" width="15.9" height="46.0" rx="0" fill="#58a772"/><text x="1071.9" y="252.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#274247" text-anchor="middle" font-variant-numeric="tabular-nums">3,8</text><rect x="1081.8" y="188.0" width="66.1" height="46.0" rx="0" fill="#00824d"/><text x="1115.9" y="218.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle" font-variant-numeric="tabular-nums">14,5</text><text x="680.0" y="272.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#5e787a" text-anchor="start">Ingen = ingen måneder med lønnsarbeid. Lav = under halvparten. Høy =</text><text x="680.0" y="289.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#5e787a" text-anchor="start">over halvparten. Full = alle månedene.</text></svg>