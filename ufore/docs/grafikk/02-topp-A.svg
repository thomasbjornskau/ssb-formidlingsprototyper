<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img"><title>Toppgrafikk A</title><desc>Andelen uføretrygdede har ligget på 10,7 prosent siden 2021, mens antallet har økt med 61 000 siden 2015.</desc><rect x="0" y="0" width="1200" height="330" fill="#ffffff"/><text x="40.0" y="46.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#5e787a" text-anchor="start">UFØRETRYGDEDE · 2015–2025</text><text x="40.0" y="112.0" font-family="Roboto Condensed, Arial Narrow, Arial, sans-serif" font-size="60" font-weight="700" fill="#00824d" text-anchor="start" font-variant-numeric="tabular-nums">389 000</text><text x="40.0" y="150.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="19" font-weight="600" fill="#274246" text-anchor="start">personer 18–67 år var uføretrygdet i 2025. Andelen</text><text x="40.0" y="176.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="19" font-weight="600" fill="#274246" text-anchor="start">har stått nesten stille i fem år.</text><text x="40.0" y="210.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#274246" text-anchor="start">Antallet har økt med 61 000 siden 2015.</text><text x="40.0" y="237.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#274246" text-anchor="start">Litt over halvparten av økningen skyldes at befolkningen</text><text x="40.0" y="258.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#274246" text-anchor="start">har vokst og blitt eldre.</text><text x="1160.0" y="318.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#5e787a" text-anchor="end">Kilde: SSB, tabell 11695, 11828 og 07459. Sist oppdatert: 02.09.2026. Dekomponering: egen beregning.</text><line x1="620.0" y1="115.6" x2="1150.0" y2="115.6" stroke="#d9dfe0" stroke-width="1"/><text x="612.0" y="120.6" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#5e787a" text-anchor="end" font-variant-numeric="tabular-nums">10</text><line x1="620.0" y1="81.2" x2="1150.0" y2="81.2" stroke="#d9dfe0" stroke-width="1"/><text x="612.0" y="86.2" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#5e787a" text-anchor="end" font-variant-numeric="tabular-nums">11</text><text x="612.0" y="44.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#5e787a" text-anchor="start">prosent</text><text x="1150.0" y="44.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#5e787a" text-anchor="end">Andel av befolkningen 18–67 år</text><polyline points="620.0,125.9 673.0,125.9 726.0,122.5 779.0,112.2 832.0,98.4 885.0,95.0 938.0,91.5 991.0,91.5 1044.0,95.0 1097.0,91.5 1150.0,91.5" fill="none" stroke="#00824d" stroke-width="2.5" stroke-linejoin="round"/><circle cx="620.0" cy="125.9" r="4" fill="#00824d"/><circle cx="1150.0" cy="91.5" r="4" fill="#00824d"/><text x="626.0" y="145.9" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#274247" text-anchor="start" font-variant-numeric="tabular-nums">9,7</text><text x="1150.0" y="81.5" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="600" fill="#274247" text-anchor="end" font-variant-numeric="tabular-nums">10,7</text><text x="620.0" y="168.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#5e787a" text-anchor="middle" font-variant-numeric="tabular-nums">2015</text><text x="885.0" y="168.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#5e787a" text-anchor="middle" font-variant-numeric="tabular-nums">2020</text><text x="1150.0" y="168.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#5e787a" text-anchor="middle" font-variant-numeric="tabular-nums">2025</text><text x="620.0" y="200.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#5e787a" text-anchor="start">Hva økningen i antall består av, 2015–2025</text><rect x="620.0" y="214.0" width="190.3" height="34.0" rx="0" fill="#5763a6"/><text x="628.0" y="237.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#ffffff" text-anchor="start" font-variant-numeric="tabular-nums">+22 139</text><text x="620.0" y="270.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#274247" text-anchor="start">Befolkningsvekst</text><rect x="812.3" y="214.0" width="97.2" height="34.0" rx="0" fill="#d5a640"/><text x="820.3" y="237.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#274246" text-anchor="start" font-variant-numeric="tabular-nums">+11 427</text><text x="812.3" y="270.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#274247" text-anchor="start">Aldring</text><rect x="911.5" y="214.0" width="236.5" height="34.0" rx="0" fill="#339b71"/><text x="919.5" y="237.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#ffffff" text-anchor="start" font-variant-numeric="tabular-nums">+27 465</text><text x="911.5" y="270.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#274247" text-anchor="start">Høyere andel i hver alder</text></svg>