<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" width="1200" height="330" role="img"><title>Toppgrafikk B</title><desc>Andelen uføretrygdede etter alder: doblet blant de unge, lavere blant de eldste, 2015 mot 2025.</desc><rect x="0" y="0" width="1200" height="330" fill="#ffffff"/><text x="40.0" y="46.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#5e787a" text-anchor="start">UFØRETRYGDEDE ETTER ALDER · 2015 OG 2025</text><text x="40.0" y="112.0" font-family="Roboto Condensed, Arial Narrow, Arial, sans-serif" font-size="60" font-weight="700" fill="#00824d" text-anchor="start" font-variant-numeric="tabular-nums">Over 4 av 100</text><text x="40.0" y="150.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="19" font-weight="600" fill="#274246" text-anchor="start">29-åringer var uføretrygdet i 2025. Andelen er</text><text x="40.0" y="176.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="19" font-weight="600" fill="#274246" text-anchor="start">dobbelt så høy som i 2015.</text><text x="40.0" y="210.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#274246" text-anchor="start">Blant 67-åringer falt andelen fra 34,4 til 28,5 prosent.</text><text x="40.0" y="237.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#274246" text-anchor="start">Den samlede andelen skjuler at unge og eldste har gått</text><text x="40.0" y="258.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="15" font-weight="400" fill="#274246" text-anchor="start">hver sin vei.</text><text x="1160.0" y="318.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="12" font-weight="400" fill="#5e787a" text-anchor="end">Kilde: SSB, tabell 11828. Sist oppdatert: 02.09.2026.</text><line x1="620.0" y1="270.0" x2="1130.0" y2="270.0" stroke="#d9dfe0" stroke-width="1"/><text x="612.0" y="275.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#5e787a" text-anchor="end" font-variant-numeric="tabular-nums">0</text><line x1="620.0" y1="208.9" x2="1130.0" y2="208.9" stroke="#d9dfe0" stroke-width="1"/><text x="612.0" y="213.9" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#5e787a" text-anchor="end" font-variant-numeric="tabular-nums">10</text><line x1="620.0" y1="147.7" x2="1130.0" y2="147.7" stroke="#d9dfe0" stroke-width="1"/><text x="612.0" y="152.7" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#5e787a" text-anchor="end" font-variant-numeric="tabular-nums">20</text><line x1="620.0" y1="86.6" x2="1130.0" y2="86.6" stroke="#d9dfe0" stroke-width="1"/><text x="612.0" y="91.6" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#5e787a" text-anchor="end" font-variant-numeric="tabular-nums">30</text><text x="612.0" y="40.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#5e787a" text-anchor="start">prosent</text><line x1="620.0" y1="270.0" x2="1130.0" y2="270.0" stroke="#a9b5b7" stroke-width="1"/><text x="620.0" y="290.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#5e787a" text-anchor="middle" font-variant-numeric="tabular-nums">18</text><text x="744.9" y="290.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#5e787a" text-anchor="middle" font-variant-numeric="tabular-nums">30</text><text x="849.0" y="290.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#5e787a" text-anchor="middle" font-variant-numeric="tabular-nums">40</text><text x="953.1" y="290.0" font-family="Open Sans, Segoe UI, Arial, sans-serif" font-size="13" font-weight="400" fill="#5e787a" text-anchor="middle" font-variant-numeric="tabular-nums">50</text><text x="1057.1