<text x="40" y="46" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#5e787a" text-anchor="start">LØNN · NOVEMBER 2025</text>
<text x="40" y="122" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="66" font-weight="700" fill="#274246" text-anchor="start">6 av 10</text>
<text x="40" y="164" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="21" font-weight="700" fill="#274246" text-anchor="start">Minst 6 av 10 har lavere månedslønn enn</text>
<text x="40" y="191" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="21" font-weight="700" fill="#274246" text-anchor="start">gjennomsnittet.</text>
<text x="40" y="225" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="400" fill="#5e787a" text-anchor="start">Gjennomsnittet var 62 070 kr, medianen 55 800 kr.</text>
<text x="40" y="246" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="400" fill="#5e787a" text-anchor="start">De 10 prosent best betalte hadde 124 470 kr i snitt og drar</text>
<text x="40" y="267" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="400" fill="#5e787a" text-anchor="start">gjennomsnittet opp.</text>
