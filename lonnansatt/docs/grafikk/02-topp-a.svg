<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img">
<title>Minst 6 av 10 har lavere lønn enn gjennomsnittet</title>
<desc>Gjennomsnittlig månedslønn i hver tidel av heltidsekvivalentene, november 2025. Gjennomsnittet er 62 070 kroner, medianen 55 800. Hele tidel 1 til 6 ligger under gjennomsnittet.</desc>
