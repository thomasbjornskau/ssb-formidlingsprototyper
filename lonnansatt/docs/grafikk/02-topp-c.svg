<text x="640" y="233.75" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="400" fill="#274246" text-anchor="start">Kommuneforvaltningen</text>
<text x="1150" y="318" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#5e787a" text-anchor="end">Kilde: SSB, tabell 11419, 11536 og 14858. Sist oppdatert: 05.02.2026, 12.03.2026 og 20.08.2026.</text>
