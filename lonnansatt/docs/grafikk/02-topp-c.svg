<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img">
<title>Lønnsveksten i 2025 avhenger av hva som måles</title>
<desc>Vekst i månedslønn november til november og i utbetalt årslønn 2025, etter sektor. Alle sektorer: 4,5 og 5,2 prosent. Påløpt årslønn: 4,9 prosent.</desc>
<rect x="0" y="0" width="1200" height="330" fill="#ffffff"/>
<text x="40" y="46" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#5e787a" text-anchor="start">LØNN · 2025</text>
<text x="40" y="122" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="60" font-weight="700" fill="#274246" text-anchor="start">4,5 eller 5,2?</text>
<text x="40" y="164" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="21" font-weight="700" fill="#274246" text-anchor="start">Hvor mye lønna steg i 2025, avhenger av hva</text>
<text x="40" y="191" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="21" font-weight="700" fill="#274246" text-anchor="start">som måles.</text>
<text x="40" y="225" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="400" fill="#5e787a" text-anchor="start">Månedslønna sammenligner november med november. Årslønna tar</text>
<text x="40" y="246" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="400" fill="#5e787a" text-anchor="start">med hele året og etterbetalinger.</text>
<text x="40" y="267" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="400" fill="#5e787a" text-anchor="start">Påløpt årslønn, der etterbetalinger føres i året de er</text>
<text x="40" y="288" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="400" fill="#5e787a" text-anchor="start">opptjent, steg 4,9 prosent.</text>
<rect x="640" y="38" width="12" height="12" fill="#339b71"/>
<text x="658" y="48" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#274246" text-anchor="start">Månedslønn, november til november</text>
<rect x="890" y="38" width="12" height="12" fill="#1d9de2"/>
<text x="908" y="48" font-family="'Open Sans', 'Segoe UI', Arial, sans-serif" font-size="12" font-weight="400" fill="#274246" text-anchor="start">Årslønn, utbetalt</text>
